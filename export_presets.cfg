; Presets d'export M.E.R.L.I.N. — versionnes volontairement.
;
; Godot regenere ce fichier des qu'on ouvre la fenetre d'export ; il etait
; jusqu'ici ignore par .gitignore, ce qui laissait le depot SANS aucune
; configuration d'export : `tools/cli.py godot export` et `list_presets`
; documentes dans CLAUDE.md echouaient faute de presets — et le workflow
; .github/workflows/godot-export.yml aussi. Mesure le 2026-07-27 : 17 echecs et
; 11 annulations sur les 30 derniers runs, aucun succes.
;
; REGLE : aucun secret ici. Pas de mot de passe de keystore, pas de chemin
; absolu machine, pas de cle d'API. Un preset Android signe DOIT passer par
; les variables d'environnement Godot, jamais par ce fichier.
;
; Les noms sont ceux qu'attend .github/workflows/godot-export.yml, qui lance
; `godot --export-release "Web"` — Godot compare le nom de preset a la CASSE
; PRES. Ils restent compatibles avec tools/adapters/godot_adapter.py::_export,
; qui derive l'extension via preset.lower() (Windows -> .exe, Linux -> .x86_64,
; Web -> .html). Les renommer casse la CI, la CLI, ou les deux.
;
; Les filtres d'exclusion tiennent le build propre : ni outillage, ni tests, ni
; documentation, ni sources de modelisation dans le binaire livre.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="docs/*, tools/*, tests/*, web-demo/*, native/*, server/*, llm_simple/*, external/*, Assets/blender/*, output/*, *.md, *.py, *.bat, *.ps1, *.blend, *.blend1"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="merlingame"
application/product_name="M.E.R.L.I.N."
application/file_description="Duel de cartes narratif — Broceliande"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
ssh_remote_deploy/enabled=false

