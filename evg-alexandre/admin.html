<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin cagnotte — mettre à jour le montant</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#EFE6D4" />
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  :root{--paper:#EFE6D4;--paper-3:#FCF8EF;--ink:#241E1A;--ink-soft:#7E7064;
    --sun:#D85A2A;--sun-deep:#B5430F;--river-deep:#125E51;--ok:#2C9A6A;--err:#C0392B;
    --stone-line:#D2C3A4;--r:22px;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(700px 480px at 88% -8%, rgba(216,90,42,.2), transparent 60%),linear-gradient(170deg,#F2E9D8,#EAE0CC);
    min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.55}
  .card{width:100%;max-width:440px;background:var(--paper-3);border:1px solid var(--stone-line);
    border-radius:var(--r);box-shadow:0 24px 48px -28px rgba(60,40,20,.5);padding:30px 26px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--sun-deep)}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;
    letter-spacing:-.02em;margin:6px 0 4px}
  h1 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:var(--sun)}
  .sub{color:var(--ink-soft);font-size:14.5px;margin-bottom:22px}
  label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:700;margin:14px 0 6px}
  input{width:100%;font-family:inherit;font-size:17px;padding:14px 15px;border-radius:13px;
    border:1.5px solid var(--stone-line);background:#fff;color:var(--ink);outline:none;
    transition:border-color .15s}
  input:focus{border-color:var(--sun)}
  .row{display:flex;gap:12px}.row>div{flex:1}
  button{width:100%;margin-top:20px;border:none;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:16.5px;color:#fff;padding:16px;border-radius:14px;min-height:54px;
    background:linear-gradient(150deg,#EC6E36,var(--sun) 55%,var(--sun-deep));
    box-shadow:0 16px 30px -14px rgba(181,67,15,.7);transition:transform .14s,filter .2s}
  button:hover{transform:translateY(-2px);filter:brightness(1.04)}
  button:disabled{opacity:.6;cursor:not-allowed;transform:none}
  .msg{margin-top:16px;padding:13px 15px;border-radius:12px;font-weight:600;font-size:14.5px;display:none}
  .msg.ok{display:block;background:rgba(44,154,106,.12);color:var(--ok);border:1px solid rgba(44,154,106,.35)}
  .msg.err{display:block;background:rgba(192,57,43,.1);color:var(--err);border:1px solid rgba(192,57,43,.35)}
  .note{margin-top:18px;font-size:13px;color:var(--ink-soft);text-align:center}
  .note a{color:var(--river-deep)}
  .warn{display:none;margin-top:14px;padding:13px 15px;border-radius:12px;font-size:14px;
    background:rgba(216,90,42,.1);color:var(--sun-deep);border:1px solid rgba(216,90,42,.3)}
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <span class="eyebrow">Admin · privé</span>
    <h1>Mettre à jour <em>la cagnotte</em></h1>
    <p class="sub">Change le montant affiché sur la page publique. Réservé à l'organisateur·trice.</p>

    <div id="warn" class="warn">⚠️ Aucun Worker configuré (<code>sync.worker_url</code> vide dans <code>config.js</code>). Renseigne l'URL après déploiement — voir <code>SETUP.md</code>.</div>

    <div class="row">
      <div>
        <label for="montant">Montant récolté (€)</label>
        <input id="montant" type="number" inputmode="numeric" min="0" step="1" placeholder="ex. 350" required />
      </div>
      <div>
        <label for="objectif">Objectif (€) — option</label>
        <input id="objectif" type="number" inputmode="numeric" min="0" step="1" placeholder="ex. 600" />
      </div>
    </div>

    <label for="pwd">Mot de passe admin</label>
    <input id="pwd" type="password" placeholder="ton mot de passe (ADMIN_SECRET)" required />

    <button id="btn" type="submit">💾 Mettre à jour</button>
    <div class="msg" id="msg"></div>

    <p class="note">↩︎ <a href="index.html">Retour à la cagnotte</a></p>
  </form>

  <script src="config.js"></script>
  <script>
  (function(){
    const C = window.CAGNOTTE_CONFIG || {};
    const $ = (id)=>document.getElementById(id);
    const url = (C.sync && C.sync.worker_url) ? C.sync.worker_url : "";
    if(!url){ $('warn').style.display='block'; }
    if(C.objectif) $('objectif').placeholder = "ex. " + C.objectif;

    $('form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const msg=$('msg'); msg.className='msg'; msg.textContent='';
      if(!url){ msg.className='msg err'; msg.textContent="Worker non configuré (config.js)."; return; }
      const montant = Number($('montant').value);
      const objectif = $('objectif').value!=='' ? Number($('objectif').value) : undefined;
      const pwd = $('pwd').value;
      const btn=$('btn'); btn.disabled=true; btn.textContent='⏳ Envoi…';
      try{
        const body = { montant };
        if(objectif!==undefined) body.objectif = objectif;
        const r = await fetch(url, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+pwd },
          body: JSON.stringify(body)
        });
        const d = await r.json().catch(()=>({}));
        if(r.ok){
          msg.className='msg ok';
          msg.textContent = `✅ Montant mis à jour : ${Number(d.montant).toLocaleString('fr-FR')} €`;
          $('pwd').value='';
        } else {
          msg.className='msg err';
          msg.textContent = '❌ ' + (d.error || ('Erreur '+r.status));
        }
      }catch(err){
        msg.className='msg err';
        msg.textContent = "❌ Impossible de joindre le Worker (réseau ?).";
      }finally{
        btn.disabled=false; btn.textContent='💾 Mettre à jour';
      }
    });
  })();
  </script>
</body>
</html>
