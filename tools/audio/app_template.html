<title>Brocéliande — lecteur</title>
<style>
/* ── Brocéliande, de nuit. Un seul theme, assume. ───────────────────────────
   La page EST le milieu : --sky1/--sky2 (ciel), --glow (lueur d'accent) et
   --fogop (densite de brume) glissent quand le milieu change. Les proprietes
   sont enregistrees pour que les degrades se fondent au lieu de sauter. */
@property --sky1{syntax:'<color>';inherits:true;initial-value:#0e1712;}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#090f0b;}
@property --glow{syntax:'<color>';inherits:true;initial-value:#c9a25e;}

:root{
  --sky1:#0e1712; --sky2:#090f0b; --glow:#c9a25e; --fogop:.05;
  --ink:#0a100c; --panel:rgba(16,24,19,.72); --line:#242f26; --line-2:#31402f;
  --fg:#e9e2ce; --fg-2:#a8a893; --fg-3:#6f7565;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,ui-serif,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  transition:--sky1 1.6s ease,--sky2 1.6s ease,--glow 1.6s ease;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{
  margin:0;color:var(--fg);background:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(44px + env(safe-area-inset-bottom));
}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── le ciel, la brume, le grain ── */
.sky{position:fixed;inset:0;z-index:-3;
  background:radial-gradient(130% 95% at 50% -12%,var(--sky1),var(--sky2) 72%);}
.fog{position:fixed;inset:-20%;z-index:-2;opacity:var(--fogop);
  transition:opacity 1.6s ease;pointer-events:none;
  background:
    radial-gradient(45% 30% at 22% 34%,#cfd8cb 0%,transparent 70%),
    radial-gradient(50% 34% at 76% 58%,#b9c8bd 0%,transparent 72%),
    radial-gradient(38% 26% at 48% 82%,#c2ccc0 0%,transparent 70%);
  animation:drift 46s linear infinite alternate;}
@keyframes drift{from{transform:translate3d(-2.5%,-1.5%,0)}to{transform:translate3d(2.5%,2%,0)}}
.grain{position:fixed;inset:0;z-index:-1;opacity:.05;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.55'/></svg>");}

.wrap{max-width:620px;margin:0 auto;
  padding-left:calc(20px + env(safe-area-inset-left));
  padding-right:calc(20px + env(safe-area-inset-right));}

/* ── l'en-tete : marque, titre, milieu ── */
header{padding-top:calc(26px + env(safe-area-inset-top))}
.crest{font-size:.86rem;letter-spacing:.45em;color:var(--fg-3);text-align:center}
.title{
  margin:6px 0 0;text-align:center;font-weight:500;font-style:italic;
  font-size:clamp(1.9rem,7vw,2.5rem);letter-spacing:.01em;line-height:1.05;
}
.milieu-line{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 18px}
.milieu-line::before,.milieu-line::after{content:"᚜";color:var(--fg-3);font-size:.8rem}
.milieu-line::before{content:"᚛"}
#milieu{
  text-transform:capitalize;
  font-style:italic;font-size:1.02rem;color:var(--glow);
  transition:color 1.6s ease;letter-spacing:.04em;
}

/* ── transport ── */
.bar{
  position:sticky;top:env(safe-area-inset-top);z-index:30;
  display:flex;align-items:center;gap:16px;padding:10px 14px;margin:0 -2px 4px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 32px -18px rgba(0,0,0,.9);flex-wrap:wrap;
}
.play{
  position:relative;width:58px;height:58px;border-radius:50%;flex:none;
  background:transparent;border:none;color:var(--glow);cursor:pointer;
  display:grid;place-items:center;transition:color 1.6s ease;
}
.play[disabled]{opacity:.45;cursor:progress}
.play svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rr-bg,.rr{fill:none;stroke-width:2.5}
.rr-bg{stroke:var(--line-2)}
.rr{stroke:currentColor;stroke-linecap:round;stroke-dasharray:157;stroke-dashoffset:157}
#glyph{font-size:1.05rem;line-height:1;transform:translateX(1px)}
.clock{font-family:var(--mono);font-size:.92rem;color:var(--fg-2);
  font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.clock b{color:var(--fg);font-weight:600;font-size:1.05rem}
.tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--fg-3)}
.tag.toggle{
  margin-left:auto;background:transparent;border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;cursor:pointer;min-height:34px;
}
.tag.toggle[aria-pressed="true"]{color:var(--ink);background:var(--glow);border-color:var(--glow)}
/* mode simple : la table se reduit aux commandes — le diagnostic
   (spectrogrammes, pupitres, ligne mixage, moteur) se deplie via « détail » */
body.simple .spectro,body.simple .insts,
body.simple .track[data-tr="mix"],body.simple #engine{display:none}
.tag.ghost{}
.tag.ghost:empty{display:none}
.tag.on{color:var(--glow)}
.msg{flex-basis:100%;font-size:.82rem;color:var(--fg-2);font-style:italic}
.msg:empty{display:none}
.msg.warn{color:var(--glow)}

/* ── sections ── */
section{margin-top:26px}
.lbl{
  display:flex;align-items:center;gap:12px;margin:0 0 12px;
  font-family:var(--mono);font-weight:400;font-size:.62rem;
  letter-spacing:.3em;text-transform:uppercase;color:var(--fg-3);
}
.lbl::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--line-2),transparent)}

/* ── scenes : cartes a defilement ── */
.scenes{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;
  scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.scenes .amb{
  scroll-snap-align:start;flex:none;width:104px;min-height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  color:var(--fg-2);cursor:pointer;padding:12px 8px;
  font-family:var(--serif);font-size:.88rem;font-style:italic;line-height:1.15;
  text-align:center;transition:border-color .18s,color .18s,transform .1s;
}
.scenes .amb .ic{width:22px;height:22px}
.scenes .amb:active{transform:scale(.96)}
.scenes .amb[aria-pressed="true"]{
  color:var(--fg);border-color:var(--glow);
  box-shadow:inset 0 0 0 1px var(--glow),0 0 22px -8px var(--glow);
}
.scenes .amb[aria-pressed="true"] .ic{color:var(--glow)}

/* ── conditions : rangées d'icones ── */
.axis{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.axis > b{font-family:var(--mono);font-weight:400;font-size:.6rem;
  letter-spacing:.22em;text-transform:uppercase;color:var(--fg-3);width:100%}
.chip.ax,.chip.fx{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:transparent;border:1px solid var(--line);border-radius:999px;
  color:var(--fg-2);font-family:var(--serif);font-size:.88rem;
  padding:8px 14px;transition:border-color .15s,color .15s,transform .1s;
}
.chip.ax:active{transform:scale(.95)}
.chip.ax[aria-pressed="true"],.chip.fx[aria-pressed="true"]{
  color:var(--ink);background:var(--glow);border-color:var(--glow);font-weight:600;
}
.ic{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* ── pistes ── */
.board{display:grid;gap:10px}
.track{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 15px 13px;display:grid;gap:8px;
  transition:border-color .5s,box-shadow .5s;
}
.track.swap{border-color:var(--glow);box-shadow:0 0 18px -10px var(--glow)}
.tr-top{display:flex;align-items:center;gap:12px}
.tr-name{font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--fg-3)}
.tr-name::before{content:"ᚋ ";color:var(--line-2)}
.meter{margin-left:auto;width:84px;height:3px;background:var(--line);
  border-radius:2px;overflow:hidden;flex:none}
.meter i{display:block;height:100%;width:0%;background:var(--fg-3);
  border-radius:2px;transition:width .09s linear}
.track.hot .meter i{background:var(--glow)}
.tr-now{
  font-size:1.35rem;line-height:1.15;color:var(--fg);font-style:italic;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.track.hot .tr-now{color:var(--glow);transition:color 1.6s ease}
.tr-now .from{color:var(--fg-3);font-size:.95rem}
.tr-now .arr{color:var(--fg-2);padding:0 6px;font-style:normal}
/* spectrogramme : le temps defile, l'aigu en haut, l'energie en lueur */
.spectro{
  width:100%;height:52px;display:block;border-radius:6px;
  background:rgba(0,0,0,.28);border:1px solid var(--line);
}
.track:not(.hot):not([data-tr="mix"]) .spectro{opacity:.35}
/* pupitres : la partition dit qui joue, la puce s'allume quand il joue */
.insts{display:flex;gap:5px;flex-wrap:wrap}
.inst{
  font-family:var(--mono);font-size:.56rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--fg-3);
  border:1px solid var(--line);border-radius:3px;padding:2px 6px;
  transition:color .25s,border-color .25s,background .25s;
}
.inst.lit{color:var(--ink);background:var(--glow);border-color:var(--glow)}
.bench{display:flex;gap:7px;flex-wrap:wrap}
.cand{
  cursor:pointer;background:transparent;color:var(--fg-2);
  border:1px solid var(--line);border-radius:999px;
  font-family:var(--serif);font-size:.85rem;padding:7px 13px;
  transition:border-color .15s,color .15s,transform .1s;
}
.cand:active{transform:scale(.95)}
.cand[aria-pressed="true"]{
  color:var(--ink);background:var(--glow);border-color:var(--glow);font-weight:600;
}

footer{margin-top:30px;text-align:center;font-family:var(--mono);
  font-size:.6rem;letter-spacing:.2em;color:var(--fg-3)}

@media (hover:hover){
  .chip.ax:hover,.chip.fx:hover,.cand:hover,.scenes .amb:hover{border-color:var(--line-2);color:var(--fg)}
}
@media (pointer:coarse){
  .chip.ax,.chip.fx,.cand{min-height:44px;padding:10px 16px}
  .scenes .amb{min-height:104px}
}
@media (min-width:760px){
  .wrap{max-width:680px}
  .scenes{flex-wrap:wrap;overflow:visible}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

/* ── teintes par milieu ── */
[data-milieu="clair"]{--sky1:#17220f;--sky2:#0c120a;--glow:#dcbb6d;--fogop:.03}
[data-milieu="jour"]{--sky1:#151f10;--sky2:#0c110b;--glow:#d3b166;--fogop:.04}
[data-milieu="ete"]{--sky1:#1a220e;--sky2:#0d1109;--glow:#dfc06a;--fogop:.03}
[data-milieu="printemps"]{--sky1:#14230f;--sky2:#0b1309;--glow:#b9cc6d;--fogop:.05}
[data-milieu="aube"]{--sky1:#241d10;--sky2:#100d0a;--glow:#e4c27c;--fogop:.07}
[data-milieu="automne"]{--sky1:#221a0d;--sky2:#110d08;--glow:#d09a52;--fogop:.06}
[data-milieu="crepuscule"]{--sky1:#231712;--sky2:#100b0a;--glow:#d99e63;--fogop:.07}
[data-milieu="couvert"]{--sky1:#161c14;--sky2:#0d110c;--glow:#adaf8e;--fogop:.09}
[data-milieu="pluie"]{--sky1:#101b20;--sky2:#0a1013;--glow:#8fb3c2;--fogop:.08}
[data-milieu="orage"]{--sky1:#171420;--sky2:#0b0a10;--glow:#dda257;--fogop:.09}
[data-milieu="brume"]{--sky1:#151b19;--sky2:#0e1211;--glow:#a4bfb2;--fogop:.2}
[data-milieu="neige"]{--sky1:#12202a;--sky2:#0b1218;--glow:#c4dcec;--fogop:.12}
[data-milieu="hiver"]{--sky1:#101c22;--sky2:#0a1014;--glow:#a9c8d8;--fogop:.1}
[data-milieu="nuit"]{--sky1:#0e1220;--sky2:#080a12;--glow:#9daed3;--fogop:.08}
</style>

<div class="sky" aria-hidden="true"></div>
<div class="fog" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>

<div class="wrap">
<header>
  <div class="crest">᚛ᚋᚓᚏᚂᚔᚅ᚜</div>
  <h1 class="title">Tri Martolod</h1>
  <div class="milieu-line"><span id="milieu">Brocéliande</span></div>

  <div class="bar">
    <button class="play" id="play" aria-label="Écouter">
      <svg class="ring" viewBox="0 0 56 56" aria-hidden="true">
        <circle class="rr-bg" cx="28" cy="28" r="25"/>
        <circle class="rr" id="ring" cx="28" cy="28" r="25"/>
      </svg>
      <span id="glyph">▶</span><span id="playlabel" class="sr">Écouter</span>
    </button>
    <div class="clock"><b id="t">0:00</b><span>/</span><span id="dur">3:16</span></div>
    <button class="tag toggle" id="detail" aria-pressed="false">détail</button>
    <div class="tag ghost" id="engine"></div>
    <div class="msg" id="msg"></div>
  </div>
</header>

<section>
  <h2 class="lbl">Scènes</h2>
  <div class="chips scenes" id="presets"></div>
</section>

<section>
  <h2 class="lbl">Conditions</h2>
  <div id="axes"></div>
</section>

<section>
  <h2 class="lbl">Effets</h2>
  <div class="chips" id="fx"></div>
</section>

<section>
  <h2 class="lbl">Pistes</h2>
  <div class="board" id="board"></div>
</section>

<footer>᚛ ᚜</footer>
</div>

<script>
const AUDIO = __AUDIO_JSON__;
const CAST  = __CASTING_JSON__;
/* qui joue quand — exporte de la partition, pas devine au spectre */
const ACT   = __ACTIVITY_JSON__;

const INST_LABEL = {
  contrabass:"Contrebasses", strings_low:"Violoncelles", strings_mid:"Seconds violons",
  viola:"Altos", strings_high:"Premiers violons", strings_tremolo:"Trémolo",
  horn:"Cor", bassoon:"Basson", oboe:"Hautbois", clarinet:"Clarinette",
  flute:"Flûte", piccolo:"Piccolo", violin_solo:"Violon solo",
  harp:"Harpe", celesta:"Célesta", glockenspiel:"Glockenspiel",
  timpani:"Timbales", taiko:"Taiko", tam_tam:"Tam-tam", bodhran:"Bodhrán",
  slit_drum:"Tambour à fente", ocean_drum:"Tambour d’océan",
  celtic_guitar:"Guitare", oud:"Oud", dan_tranh:"Đàn tranh", kalimba:"Kalimba",
  psaltery:"Psaltérion", mbira:"Mbira", wine_glasses:"Verres",
  hand_chimes:"Clochettes", cor_anglais:"Cor anglais", ocarina:"Ocarina",
  harmonica:"Harmonica",
};

const AXIS_LABEL = {meteo:"Météo", saison:"Saison", moment:"Moment"};
/* les valeurs internes sont sans accent (cles de fichiers) ; l'ecran, lui,
   ecrit le francais correctement */
const VAL_LABEL = {ete:"été", crepuscule:"crépuscule"};
const vlabel = v => VAL_LABEL[v] || v;
const ROLE_LABEL = {chant:"Chant", corde:"Corde", halo:"Halo", pulse:"Pouls"};

/* Présets COMBINATOIRES : chacun pose des AXES (météo + saison + moment),
   pas une distribution figée. La table de contexte en déduit les titulaires ET
   le milieu — et l'état reste lisible et modifiable axe par axe après coup. */
const PRESETS = [
  {id:"broceliande", label:"Brocéliande",   ctx:{}, ic:"broceliande"},
  {id:"pluie",       label:"Pluie d’été",   ctx:{meteo:"pluie", saison:"ete"}, ic:"pluie"},
  {id:"orage",       label:"Orage",         ctx:{meteo:"orage"}, ic:"orage"},
  {id:"neige",       label:"Neige",         ctx:{meteo:"neige"}, ic:"neige"},
  {id:"hiver",       label:"Nuit d’hiver",  ctx:{saison:"hiver", moment:"nuit"}, ic:"nuit"},
  {id:"printemps",   label:"Aube claire",   ctx:{moment:"aube"}, ic:"aube"},
  {id:"lointain",    label:"Brume de nuit", ctx:{meteo:"brume", moment:"nuit"}, ic:"brume"},
  {id:"fete",        label:"Fête d’été",    ctx:{meteo:"clair", saison:"ete", moment:"jour"}, ic:"ete"},
  {id:"veillee",     label:"Veillée",       ctx:{saison:"automne", moment:"crepuscule"}, ic:"crepuscule"},
];

/* Icones gravees au trait — 15 px, courant de couleur. Des dessins, pas des
   emojis : le rendu emoji change de style selon la plateforme et jure avec
   l'encre. */
const ICON = {
  clair:'<circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/>',
  couvert:'<path d="M4.6 11.5a3 3 0 1 1 .7-5.9 3.8 3.8 0 0 1 7.4 1.1 2.4 2.4 0 0 1-.5 4.8z"/>',
  pluie:'<path d="M4.6 9.5a3 3 0 1 1 .7-5.9 3.8 3.8 0 0 1 7.4 1.1 2.4 2.4 0 0 1-.5 4.8z"/><path d="M5 12v2.2M8 12.6v2.2M11 12v2.2"/>',
  orage:'<path d="M4.6 9.5a3 3 0 1 1 .7-5.9 3.8 3.8 0 0 1 7.4 1.1 2.4 2.4 0 0 1-.5 4.8z"/><path d="M8.6 9.6l-2.1 3.1h2.2L7.4 15.5"/>',
  brume:'<path d="M2.5 6h11M4 9h9M3 12h10"/>',
  neige:'<path d="M8 2v12M3 5l10 6M13 5L3 11"/>',
  printemps:'<path d="M8 14.5V7M8 7C8 4 6 3 3.5 3c0 3 1.5 4 4.5 4zM8 9c0-2.5 2-3.5 4.5-3.5C12.5 8 11 9 8 9z"/>',
  ete:'<circle cx="8" cy="8" r="3.5"/><path d="M8 1v2.1M8 12.9V15M1 8h2.1M12.9 8H15"/>',
  automne:'<path d="M8 14c0-4 .5-8 5-11-6 0-9 3-9 8 0 1.7 1.8 3 4 3z"/>',
  hiver:'<path d="M8 2v12M4 4.5l8 7M12 4.5l-8 7"/>',
  aube:'<path d="M1.5 11.5h13M4.5 11.5a3.5 3.5 0 0 1 7 0M8 4v2.2M3.2 6l1.4 1.4M12.8 6l-1.4 1.4"/>',
  jour:'<circle cx="8" cy="8" r="3.4"/><path d="M8 1.2v2M8 12.8v2M1.2 8h2M12.8 8h2"/>',
  crepuscule:'<path d="M1.5 10.5h13M4.5 10.5a3.5 3.5 0 0 1 7 0M8 13.2v1.6M4.4 13.6l1 1.1M11.6 13.6l-1 1.1"/>',
  nuit:'<path d="M12.6 10.2A5.6 5.6 0 1 1 7 2.4a4.5 4.5 0 0 0 5.6 7.8z"/>',
  broceliande:'<path d="M8 15V9M8 9C4.5 9 3 6.2 3 3c3 0 5 1.2 5 4.2C8 4.2 10 3 13 3c0 3.2-1.5 6-5 6z"/>',
  vent:'<path d="M2 5.5h7a2 2 0 1 0-2-2M2 8.5h10a2 2 0 1 1-2 2M2 11.5h5"/>',
  oiseau:'<path d="M1.5 11c3.5.5 6-1 7.5-4.5M9 6.5C10 4.5 12 4 14 4.5L12.5 6l1.5 1c-2 1.5-4 1.5-5 .5M9 6.5 6 13"/>',
  grillon:'<path d="M3 9a5 5 0 0 1 10 0M5.5 9a2.6 2.6 0 0 1 5 0M8 9v3.5"/>',
};
function icon(name){
  const d = ICON[name];
  return d ? '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true">'+d+'</svg>' : '';
}

const $ = s => document.querySelector(s);
const playBtn=$("#play"), glyph=$("#glyph"), playLabel=$("#playlabel");
const clock=$("#t"), durEl=$("#dur"), msgEl=$("#msg"), engineEl=$("#engine"), loopTag=$("#looptag");

let cast = Object.assign({}, CAST.default);
let context = {};
let playing = false, unlocked = false;
const el = {};            /* nom -> HTMLAudioElement */
const vol = {};           /* nom -> {cur, target} */
let raf = 0, lastSync = 0;

function say(m, warn){ msgEl.textContent = m || ""; msgEl.classList.toggle("warn", !!warn); }
function key(role, id){ return role + "__" + id; }
function cands(role){ return (CAST.candidates && CAST.candidates[role]) || []; }
function entry(role, id){ return cands(role).find(c => c.id === id); }
/* Le gain vient de casting.json : correctif d'appariement mesuré sur les
   fichiers rendus. Sans lui le đàn tranh sort 5 dB sous la guitare. */
function trim(role, id){ const c = entry(role, id); return c && +c.gain ? +c.gain : 1; }

/* ── moteur : des éléments <audio>, pas du Web Audio ────────────────────────
   Décoder quatre pistes de 196 s dans la RAM faisait échouer la page sur
   téléphone, et le repli figeait toute la distribution. Un <audio> diffuse au
   lieu de tout décoder. Ils sont tous « déverrouillés » au premier appui —
   iOS refuse un play() hors geste utilisateur, mais accepte de reprendre un
   élément déjà joué une fois. C'est ce qui rend la bascule possible ensuite. */
/* NŒUD DE GAIN, PAS a.volume. Deux raisons, toutes deux mesurées :

   1. Sur iOS, HTMLMediaElement.volume est EN LECTURE SEULE — l'affectation est
      ignorée sans erreur. Avec a.volume seul, l'ancien titulaire continuait
      donc à sortir à plein niveau pendant les trois secondes du fondu, puis
      se coupait net : on entendait deux instruments à la fois, et le fondu
      croisé n'existait pas sur téléphone.
   2. a.volume est borné à [0,1]. Or six des douze correctifs d'appariement
      dépassent 1 (psaltérion 1,93, đàn tranh 1,66, verres 1,41, oud 1,25,
      kalimba 1,07, ocarina 1,005). Ils étaient tous écrêtés à 1,0 : le
      psaltérion sortait 5,7 dB trop bas, exactement l'écart que match_levels
      avait mesuré et corrigé. L'appariement à 0,00 dB était calculé mais pas
      appliqué.

   Un GainNode accepte les gains > 1 et fonctionne sur iOS. L'élément <audio>
   reste la source : on continue de DIFFUSER, on ne décode pas 196 s en RAM —
   c'est ce décodage qui faisait échouer la page sur téléphone. */
let AC = null, webGain = false;
const gain = {};
const anl = {};           /* nom -> AnalyserNode */

function audioCtx(){
  if(AC !== null) return AC;
  const C = window.AudioContext || window.webkitAudioContext;
  if(!C){ AC = false; return AC; }
  try{ AC = new C(); }catch(e){ AC = false; }
  if(AC) buildBus();
  return AC;
}

/* ── LE BUS DE MILIEU ───────────────────────────────────────────────────────
   Changer d'instrument ne suffit pas à changer de monde. Ce qui fait entendre
   un milieu gelé, ce n'est pas seulement un carillon à la place d'une célesta :
   c'est un aigu clairsemé, une queue de réverbe longue et sombre, un grave
   retiré. Le froid s'entend à ce qui manque dans le bas.

   Deux shelfs et une réverbe à réponse impulsionnelle calculée. Tout est
   appliqué À LA LECTURE : on entend le milieu changer sans rien re-rendre.
   Voir docs/80_sound/30_music/MUSICOLOGIE_PRIME.md §4. */
let BUS = null, LOW = null, HIGH = null, WET = null, CONV = null, DRY = null, MASTER = null;

function buildBus(){
  const c = AC;
  BUS  = c.createGain();
  LOW  = c.createBiquadFilter(); LOW.type  = "lowshelf";  LOW.frequency.value  = 220;
  HIGH = c.createBiquadFilter(); HIGH.type = "highshelf"; HIGH.frequency.value = 4200;
  DRY  = c.createGain(); WET = c.createGain(); WET.gain.value = 0;
  CONV = c.createConvolver();
  BUS.connect(LOW); LOW.connect(HIGH);
  const SUM = c.createGain();
  HIGH.connect(DRY); DRY.connect(SUM);
  HIGH.connect(CONV); CONV.connect(WET); WET.connect(SUM);
  SUM.connect(c.destination);
  MASTER = c.createAnalyser();
  MASTER.fftSize = 2048; MASTER.smoothingTimeConstant = 0.55;
  SUM.connect(MASTER);
  applyMix(resolveMix());
}

/* Bruit décroissant, assombri progressivement : une queue dont l'amortissement
   se resserre avec le temps, comme une vraie salle. `damp` fixe la vitesse à
   laquelle l'aigu s'éteint — c'est lui qui distingue une caverne d'un couloir. */
function makeIR(decay, damp){
  const c = AC, n = Math.max(1, Math.floor(c.sampleRate * decay));
  const buf = c.createBuffer(2, n, c.sampleRate);
  const k = Math.exp(-2 * Math.PI * Math.min(damp, c.sampleRate / 2.2) / c.sampleRate);
  for(let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    let z = 0, seed = 1337 + ch * 7919;
    for(let i = 0; i < n; i++){
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;      /* bruit reproductible */
      const white = (seed / 0x3fffffff) - 1;
      z = white * (1 - k) + z * k;                          /* passe-bas 1 pôle */
      d[i] = z * Math.pow(1 - i / n, 2.4);                  /* décroissance */
    }
  }
  return buf;
}

let mixNow = null;
function applyMix(m){
  if(!AC || !BUS || !m) return;
  const t = AC.currentTime, R = 0.6;          /* le milieu glisse, il ne saute pas */
  LOW.gain.setTargetAtTime(m.low, t, R);
  HIGH.gain.setTargetAtTime(m.high, t, R);
  WET.gain.setTargetAtTime(m.space, t, R);
  DRY.gain.setTargetAtTime(1 - 0.35 * m.space, t, R);
  const sig = m.decay + "/" + m.damp;
  if(sig !== mixNow){                          /* l'IR ne se recalcule qu'au besoin */
    try{ CONV.buffer = makeIR(m.decay, m.damp); mixNow = sig; }catch(e){}
  }
  /* la page entiere prend la teinte du milieu : ciel, brume, lueur */
  document.documentElement.dataset.milieu = m.source || "neutre";
  const tag = document.querySelector("#milieu");
  if(tag) tag.textContent = m.source && m.source !== "neutre" ? vlabel(m.source) : "Brocéliande";
}

/* Même priorité que la distribution : météo > saison > moment. Un seul milieu
   l'emporte — superposer deux traitements d'espace ne veut plus rien dire. */
function resolveMix(){
  const table = CAST.mix || {};
  for(const axis of (CAST.priority || [])){
    const v = context[axis];
    if(v && table[v]) return Object.assign({source:v}, table[v]);
  }
  return Object.assign({source:"neutre"}, CAST.mix_neutral ||
    {low:0, high:0, space:0.16, decay:2.6, damp:5200});
}

/* LE GÉNÉRATEUR PRÉFIXE LES PARTIES DE RÔLE PAR « P_ ». Sans cette résolution,
   AUDIO["chant__flute"] valait undefined, la source devenait la chaîne
   "data:audio/mpeg;base64,undefined" et le navigateur répondait
   MEDIA_ERR_SRC_NOT_SUPPORTED sur les douze parties. Seul le socle sortait —
   et rien ne le montrait, parce que les jauges lisent l'état JS et non l'audio.
   On accepte les deux écritures pour rester compatible des deux gabarits. */
function data(name){
  if(AUDIO[name] !== undefined) return AUDIO[name];
  if(AUDIO["P_" + name] !== undefined) return AUDIO["P_" + name];
  return null;
}

function make(name){
  if(el[name]) return el[name];
  const b64 = data(name);
  const a = new Audio();
  if(b64 === null){
    say("Piste absente du fichier : " + name, true);
    el[name] = a; vol[name] = {cur:0, target:0};
    return a;
  }
  a.src = "data:audio/mpeg;base64," + b64;
  a.loop = true; a.preload = "auto"; a.volume = 0;
  a.playsInline = true; a.setAttribute("playsinline", "");
  el[name] = a; vol[name] = {cur:0, target:0};
  const ctx = audioCtx();
  if(ctx){
    try{
      const src = ctx.createMediaElementSource(a);
      const g = ctx.createGain();
      g.gain.value = 0;
      /* un analyseur par piste : le spectrogramme lit ICI, apres le gain —
         ce qu'on voit est ce qu'on entend, correctifs de niveau compris */
      const an = ctx.createAnalyser();
      an.fftSize = 2048; an.smoothingTimeConstant = 0.55;
      src.connect(g); g.connect(an); an.connect(BUS || ctx.destination);
      gain[name] = g; anl[name] = an; webGain = true;
      a.volume = 1;                    /* le gain fait le travail en aval */
    }catch(e){ /* pas de graphe : on retombe sur a.volume, écrêté à 1 */ }
  }
  return a;
}

/* Un seul point d'application, pour que le repli soit impossible à oublier. */
function setLevel(name, v){
  const g = gain[name];
  if(g){ try{ g.gain.value = Math.max(0, v); return; }catch(e){} }
  const a = el[name];
  if(a){ try{ a.volume = Math.max(0, Math.min(1, v)); }catch(e){} }
}

/* ATTENDRE LA FIN DU DÉVERROUILLAGE AVANT DE JOUER. La pause de déverrouillage
   part dans un .then() ; en démarrant le socle tout de suite, cette pause
   arrivait APRÈS et remettait en pause le socle qu'on venait de lancer. Le
   symptôme est exactement « on touche Écouter et rien ne se passe » : les
   compteurs tournent, playing vaut true, et le socle est à l'arrêt.
   Rejouer un élément déjà déverrouillé ne demande plus de geste, donc démarrer
   depuis le .then() reste autorisé par iOS. Le délai de garde évite de rester
   bloqué si une promesse ne se règle jamais. */
function unlockAll(){
  const names = ["bed"];
  (CAST.roles||[]).forEach(r => cands(r).forEach(c => names.push(key(r, c.id))));
  const all = names.map(n => {
    const a = make(n);
    const done = () => { try{ a.pause(); a.currentTime = 0; }catch(e){} };
    let p;
    try{ p = a.play(); }catch(e){ done(); return Promise.resolve(); }
    if(p && p.then) return p.then(done).catch(()=>{ done(); });
    done(); return Promise.resolve();
  });
  unlocked = true;
  return Promise.race([
    Promise.all(all),
    new Promise(res => setTimeout(res, 1200)),
  ]);
}

function bedTime(){
  const b = el.bed;
  return b && b.duration ? b.currentTime : 0;
}

function startPart(name){
  const a = make(name);
  if(!a.paused) return;
  try{ a.currentTime = bedTime(); }catch(e){}
  const p = a.play();
  if(p && p.catch) p.catch(()=>{ say("Le navigateur a refusé de démarrer une piste.", true); });
}

function applyTargets(){
  Object.keys(vol).forEach(n => { vol[n].target = 0; });
  if(!playing) return;
  vol.bed = vol.bed || {cur:0, target:0};
  vol.bed.target = 1;
  (CAST.roles||[]).forEach(r => {
    const n = key(r, cast[r]);
    vol[n] = vol[n] || {cur:0, target:0};
    vol[n].target = trim(r, cast[r]);
  });
  /* les effets d'ambiance actives gardent leur niveau : ils ne dependent pas
     de la distribution */
  Object.keys(fxOn).forEach(n => {
    vol[n] = vol[n] || {cur:0, target:0};
    vol[n].target = fxOn[n];
  });
  /* Couper franchement ce qui est déjà à zéro. Le fondu ne met en pause que ce
     qui DESCEND ; les douze pistes réveillées par le déverrouillage restaient
     donc en lecture à gain nul — inaudibles, mais douze décodages simultanés
     sur la batterie du téléphone. Mesuré : onze pistes actives au lieu de
     quatre. */
  Object.keys(vol).forEach(n => {
    const a = el[n];
    if(!a || n === "bed") return;
    if(vol[n].target === 0 && vol[n].cur <= 0.001 && !a.paused){
      try{ a.pause(); a.currentTime = 0; }catch(e){}
    }
  });
}

let lastTs = 0;
function tick(ts){
  raf = requestAnimationFrame(tick);
  /* TEMPS RÉEL, PAS UN PAS FIXE. En supposant 60 images/s le fondu durait
     3 s seulement si le navigateur tenait vraiment 60 Hz ; dès que la cadence
     tombe — onglet en arrière-plan, défilement, économie d'énergie sur
     téléphone — le fondu s'étirait d'autant. Mesuré à 1,21 au lieu de 1,93
     après 3,6 s sur un rendu ralenti. Le plafond à 0,1 s évite un saut brutal
     au retour d'un onglet resté caché. */
  const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 1/60;
  lastTs = ts;
  /* La pente est rapportée à l'amplitude en jeu, sinon un titulaire à fort
     correctif met plus longtemps : à 1/3 par seconde, atteindre 1,93
     (psaltérion) demandait 5,8 s au lieu de 3. */
  Object.keys(vol).forEach(n => {
    const v = vol[n], a = el[n];
    if(!a) return;
    if(Math.abs(v.cur - v.target) > 0.001){
      const step = Math.max(1, v.target, v.cur) * dt / 3.0;
      v.cur += Math.sign(v.target - v.cur) * Math.min(step, Math.abs(v.target - v.cur));
      setLevel(n, v.cur);
      if(v.cur <= 0.001 && v.target === 0 && !a.paused && n !== "bed") a.pause();
    }
  });

  if(playing && el.bed){
    /* RECALAGE SANS SEEK. L'ancienne version faisait a.currentTime = t sur
       des pistes EN LECTURE dès 80 ms d'écart. Un seek sur un élément qui
       joue est un trou audible — et sur un téléphone qui décode dix-huit
       éléments, les écarts sont fréquents : c'était le « ça coupe », remis
       toutes les deux secondes.
       Une piste audible n'est plus JAMAIS repositionnée : on corrige sa
       VITESSE (±0,3 %, ~5 cents, sous le vibrato des instruments), et le
       seek reste réservé aux pistes inaudibles ou à un décrochage franc
       (>0,6 s), où le trou est de toute façon moindre que le décalage. */
    if(ts - lastSync > 500){
      lastSync = ts;
      const t = el.bed.currentTime, d = el.bed.duration || 1;
      Object.keys(el).forEach(n => {
        if(n === "bed" || n.slice(0, 3) === "FX_") return;
        const a = el[n];
        if(a.paused || !a.duration) return;
        let diff = a.currentTime - t;
        if(diff >  d/2) diff -= d;
        if(diff < -d/2) diff += d;
        const audible = vol[n] && vol[n].cur > 0.02;
        if(!audible){
          if(Math.abs(diff) > 0.05){ try{ a.currentTime = t; }catch(e){} }
          if(a.playbackRate !== 1) a.playbackRate = 1;
        }else if(Math.abs(diff) > 0.6){
          try{ a.currentTime = t; }catch(e){}
          if(a.playbackRate !== 1) a.playbackRate = 1;
        }else if(Math.abs(diff) > 0.03){
          try{ a.preservesPitch = false; a.webkitPreservesPitch = false; }catch(e){}
          a.playbackRate = 1 - Math.max(-0.003, Math.min(0.003, diff * 0.05));
        }else if(a.playbackRate !== 1){
          a.playbackRate = 1;
        }
      });
    }
    const t = el.bed.currentTime;
    clock.textContent = Math.floor(t/60) + ":" + String(Math.floor(t%60)).padStart(2,"0");
    drawSpectros();
    paintInsts(ts);
  }
  paintLevels();
}

/* ── interface ─────────────────────────────────────────────────────────── */
const boardEl = $("#board");
const switching = {};          /* role -> minuterie du fondu affiche */

function instLabel(i){ return INST_LABEL[i] || i; }

/* tous les pupitres qu'une piste peut employer, releves de la partition */
function trackInsts(tr){
  if(tr === "bed") return Object.keys(ACT.bed || {});
  const set = {};
  if(tr === "mix") return [];
  cands(tr).forEach(c => Object.keys(ACT[tr + "__" + c.id] || {}).forEach(i => set[i] = 1));
  return Object.keys(set);
}

function buildBoard(){
  const rows = [{id:"mix", name:"Mixage", fixed:true},
                {id:"bed", name:"Socle", fixed:true}]
    .concat((CAST.roles||[]).map(r => ({id:r, name:ROLE_LABEL[r]||r})));
  boardEl.innerHTML = rows.map(r => {
    const insts = trackInsts(r.id);
    return '<div class="track" data-tr="'+r.id+'">'+
      '<div class="tr-top"><span class="tr-name">'+r.name+'</span>'+
        '<span class="tr-now" data-now="'+r.id+'">'+
        (r.id==="mix" ? "— tout —" : r.fixed ? "— fixe —" : "—")+'</span>'+
        '<span class="meter"><i></i></span></div>'+
      '<canvas class="spectro" data-sp="'+r.id+'"></canvas>'+
      (insts.length ?
      '<div class="insts">'+ insts.map(i =>
        '<span class="inst" data-inst="'+i+'">'+instLabel(i)+'</span>').join("") +'</div>' : "")+
      (r.fixed ? "" :
      '<div class="bench">'+ cands(r.id).map(c =>
        '<button class="cand" data-role="'+r.id+'" data-id="'+c.id+'" aria-pressed="false">'+
        c.label+'</button>').join("") +'</div>')+
    '</div>';
  }).join("");
  initSpectros();
  document.querySelectorAll(".cand").forEach(b => b.addEventListener("click", () => {
    context = {}; syncAxisChips();
    const next = Object.assign({}, cast); next[b.dataset.role] = b.dataset.id;
    setCast(next);
  }));
}

/* ── SPECTROGRAMMES ─────────────────────────────────────────────────────
   Un canvas par piste, temps qui defile, echelle de frequence LOGARITHMIQUE
   (80 Hz - 8 kHz : la ou vit la musique — en lineaire, tout l'interessant
   s'ecrase dans le cinquieme du bas). L'analyseur lit APRES le gain de la
   piste : ce qu'on voit est ce qu'on entend. On ne dessine que les pistes
   audibles, une colonne sur deux images — c'est un telephone. */
const spCtx = {};                    /* id -> {cv, cx, w, h, rows} */
const SP_FMIN = 80, SP_FMAX = 8000;

function initSpectros(){
  document.querySelectorAll(".spectro").forEach(cv => {
    const w = Math.max(60, Math.floor(cv.clientWidth || 320));
    const h = 52;
    cv.width = w; cv.height = h;
    const cx = cv.getContext("2d");
    cx.fillStyle = "rgba(0,0,0,0)"; cx.clearRect(0, 0, w, h);
    /* pre-calcul : pixel vertical -> bin FFT (echelle log) */
    const rows = new Int16Array(h);
    const nyq = (AC ? AC.sampleRate : 48000) / 2, bins = 1024;
    for(let y = 0; y < h; y++){
      const f = SP_FMIN * Math.pow(SP_FMAX / SP_FMIN, 1 - y / (h - 1));
      rows[y] = Math.min(bins - 1, Math.round(f / nyq * bins));
    }
    spCtx[cv.dataset.sp] = {cv, cx, w, h, rows};
  });
}

let spFlip = false;
const spBuf = new Uint8Array(1024);

function glowRGB(){
  const v = getComputedStyle(document.documentElement)
    .getPropertyValue("--glow").trim();
  const m = /^#?([0-9a-f]{6})$/i.exec(v);
  if(!m) return [201, 162, 94];
  const x = parseInt(m[1], 16);
  return [x >> 16 & 255, x >> 8 & 255, x & 255];
}
let GLOW_RGB = [201, 162, 94];
setInterval(() => { GLOW_RGB = glowRGB(); }, 900);

function drawSpectros(){
  if(document.body.classList.contains("simple")) return;   /* rien a peindre */
  spFlip = !spFlip;
  if(!spFlip || !AC) return;
  Object.keys(spCtx).forEach(id => {
    const an = id === "mix" ? MASTER :
      id === "bed" ? anl.bed : anl[key(id, cast[id])];
    const s = spCtx[id];
    if(!an || !s) return;
    const audible = id === "mix" || id === "bed" ||
      (vol[key(id, cast[id])] && vol[key(id, cast[id])].cur > 0.02);
    if(!audible) return;
    an.getByteFrequencyData(spBuf);
    /* fait defiler d'un pixel, puis peint la colonne de droite */
    s.cx.drawImage(s.cv, -1, 0);
    const col = s.cx.createImageData(1, s.h);
    const [gr, gg, gb] = GLOW_RGB;
    for(let y = 0; y < s.h; y++){
      const v = spBuf[s.rows[y]] / 255;
      const a = Math.pow(v, 1.6);
      const o = y * 4;
      col.data[o]     = gr * a + 10;
      col.data[o + 1] = gg * a + 16;
      col.data[o + 2] = gb * a + 12;
      col.data[o + 3] = 255 * Math.min(1, 0.16 + a);
    }
    s.cx.putImageData(col, s.w - 1, 0);
  });
}

/* ── PUPITRES : la partition allume les puces ─────────────────────────── */
function playingSpans(spans, t){
  for(let i = 0; i < spans.length; i++){
    if(t < spans[i][0]) return false;
    if(t <= spans[i][1]) return true;
  }
  return false;
}
let lastInst = 0;
function paintInsts(ts){
  if(document.body.classList.contains("simple")) return;
  if(ts - lastInst < 120) return;
  lastInst = ts;
  const t = el.bed && el.bed.duration ? el.bed.currentTime : 0;
  document.querySelectorAll(".track").forEach(row => {
    const id = row.dataset.tr;
    if(id === "mix") return;
    const src = id === "bed" ? ACT.bed : ACT[id + "__" + cast[id]];
    row.querySelectorAll(".inst").forEach(chip => {
      const spans = src && src[chip.dataset.inst];
      chip.classList.toggle("lit", !!(playing && spans && playingSpans(spans, t)));
    });
  });
}

function paintLevels(){
  /* La jauge est rapportee au gain nominal du titulaire, pas a 1 : le
     psalterion joue a 1,93 et saturerait la barre des le debut du fondu. */
  const set = (id, name, hot, full) => {
    const box = boardEl.querySelector('.track[data-tr="'+id+'"]');
    if(!box) return;
    const v = vol[name] ? vol[name].cur : 0;
    box.querySelector(".meter i").style.width =
      Math.round(Math.min(1, v / (full || 1)) * 100) + "%";
    box.classList.toggle("hot", !!hot && v > 0.02);
  };
  set("mix", "bed", false, 1);
  set("bed", "bed", false, 1);
  (CAST.roles||[]).forEach(r => set(r, key(r, cast[r]), true, trim(r, cast[r])));
  const ring = document.getElementById("ring");
  if(ring && el.bed && el.bed.duration){
    ring.style.strokeDashoffset =
      (157 * (1 - el.bed.currentTime / el.bed.duration)).toFixed(1);
  }
}

function sameCtx(a, b){
  return Object.keys(CAST.axes || {}).every(k => (a[k] || null) === (b[k] || null));
}

function paint(){
  document.querySelectorAll(".cand").forEach(b =>
    b.setAttribute("aria-pressed", String(cast[b.dataset.role] === b.dataset.id)));
  (CAST.roles||[]).forEach(r => {
    if(switching[r]) return;             /* la ligne montre « ancien → nouveau » */
    const e = entry(r, cast[r]);
    const now = boardEl.querySelector('[data-now="'+r+'"]');
    if(now && e) now.textContent = e.label;
  });
  document.querySelectorAll(".chip.amb").forEach(b => {
    const pz = PRESETS.find(x => x.id === b.dataset.amb);
    b.setAttribute("aria-pressed", String(!!pz && sameCtx(context, pz.ctx)));
  });
  paintLevels();
}

function setCast(next){
  (CAST.roles||[]).forEach(r => {
    if(cast[r] === next[r]) return;
    const oldE = entry(r, cast[r]), newE = entry(r, next[r]);
    cast[r] = next[r];
    if(playing) startPart(key(r, cast[r]));
    /* pendant le fondu croise, la ligne montre le remplacement en cours */
    const now = boardEl.querySelector('[data-now="'+r+'"]');
    const row = boardEl.querySelector('.track[data-tr="'+r+'"]');
    if(now && oldE && newE){
      now.innerHTML = '<span class="from">'+oldE.label+'</span>'+
                      '<span class="arr">→</span>'+newE.label;
      if(row) row.classList.add("swap");
      clearTimeout(switching[r]);
      switching[r] = setTimeout(() => {
        delete switching[r];
        if(row) row.classList.remove("swap");
        paint();
      }, 3200);
    }
  });
  applyTargets(); paint(); applyMix(resolveMix());
  applyWeatherFx();
}

/* Role par role, le premier axe qui se prononce l'emporte ; le titulaire par
   defaut ferme la marche, donc il y a toujours exactement un instrument par role. */
function resolve(){
  const out = Object.assign({}, CAST.default), done = {};
  (CAST.priority||[]).forEach(axis => {
    const v = context[axis]; if(!v) return;
    const m = (CAST.context||{})[v] || {};
    Object.keys(m).forEach(r => { if(!done[r]){ out[r] = m[r]; done[r] = true; } });
  });
  return out;
}

/* presets — combinables avec les axes : un preset POSE des axes, il ne fige rien */
const PRESETS_AVAIL = PRESETS.filter(pz =>
  Object.keys(pz.ctx).every(a => CAST.axes && CAST.axes[a]));
$("#presets").innerHTML = PRESETS_AVAIL.map(pz =>
  '<button class="chip amb" data-amb="'+pz.id+'" aria-pressed="false">'+
  icon(pz.ic)+'<span>'+pz.label+'</span></button>').join("");
$("#presets").querySelectorAll(".amb").forEach(b => b.addEventListener("click", () => {
  const pz = PRESETS.find(x => x.id === b.dataset.amb);
  context = Object.assign({}, pz.ctx);
  syncAxisChips();
  setCast(resolve());
}));

/* axes */
const axesEl = $("#axes");
Object.keys(CAST.axes || {}).forEach(axis => {
  const row = document.createElement("div");
  row.className = "axis";
  row.innerHTML = "<b>"+(AXIS_LABEL[axis]||axis)+"</b>";
  CAST.axes[axis].forEach(value => {
    const b = document.createElement("button");
    b.className = "chip ax";
    b.innerHTML = icon(value) + "<span>" + vlabel(value) + "</span>";
    b.setAttribute("aria-pressed","false");
    b.dataset.axis = axis; b.dataset.val = value;
    b.addEventListener("click", () => {
      if(context[axis] === value) delete context[axis];
      else context[axis] = value;
      syncAxisChips();
      setCast(resolve());
    });
    row.appendChild(b);
  });
  axesEl.appendChild(row);
});

/* ── effets d'ambiance ──────────────────────────────────────────────────
   Independants de la distribution, mais routes par le MEME bus : la pluie
   recoit la reverbe du milieu, le tonnerre gronde dans la salle en cours.
   Les boucles se fondent en 3 s par la meme rampe que les instruments ;
   le tonnerre est un one-shot joue a la demande. */
const fxOn = {};
const FXLIST = CAST.sfx || [];
/* chaque temps propose son ambiance ; le bouton « Ambiance auto » active ou
   coupe ce lien d'un geste — les boutons individuels restent souverains */
const FX_BY_METEO = {
  clair:["oiseaux"], couvert:["vent"], pluie:["pluie"],
  orage:["pluie","vent"], brume:["vent"], neige:["vent"],
};
let fxAuto = true;
function applyWeatherFx(){
  if(!fxAuto) return;
  const want = FX_BY_METEO[context.meteo] || [];
  FXLIST.forEach(e => {
    if(!e.loop) return;
    const name = "FX_" + e.id, on = want.indexOf(e.id) >= 0;
    if(on && !fxOn[name]){
      fxOn[name] = e.gain;
      const a = make(name);
      if(playing && a.paused){ const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{}); }
    }else if(!on && fxOn[name]){
      delete fxOn[name];
    }
    const b = document.querySelector('.chip.fx[data-fx="' + e.id + '"]');
    if(b) b.setAttribute("aria-pressed", String(!!fxOn[name]));
  });
  /* l'orage tonne une fois en entrant */
  if(context.meteo === "orage" && playing){
    const th = FXLIST.find(x => x.id === "tonnerre");
    if(th){
      const name = "FX_tonnerre", a = make(name);
      a.loop = false;
      vol[name] = {cur:th.gain, target:th.gain};
      setLevel(name, th.gain);
      try{ a.currentTime = 0; }catch(err){}
      const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{});
    }
  }
  applyTargets();
}
if(FXLIST.length){
  $("#fx").innerHTML = '<button class="chip fx" id="fxauto" aria-pressed="true">'+
    icon("broceliande")+'<span>Ambiance auto</span></button>' + FXLIST.map(e =>
    '<button class="chip fx" data-fx="'+e.id+'" aria-pressed="false">'+
    icon(e.ic)+'<span>'+e.label+'</span></button>').join("");
  $("#fxauto").addEventListener("click", () => {
    fxAuto = !fxAuto;
    $("#fxauto").setAttribute("aria-pressed", String(fxAuto));
    if(fxAuto) applyWeatherFx();
  });
  $("#fx").querySelectorAll(".fx[data-fx]").forEach(b => b.addEventListener("click", () => {
    const e = FXLIST.find(x => x.id === b.dataset.fx);
    const name = "FX_" + e.id;
    if(!e.loop){
      const a = make(name);
      a.loop = false;
      vol[name] = {cur:e.gain, target:e.gain};
      setLevel(name, e.gain);
      try{ a.currentTime = 0; }catch(err){}
      const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{});
      b.setAttribute("aria-pressed","true");
      setTimeout(() => b.setAttribute("aria-pressed","false"), 1400);
      return;
    }
    const on = !fxOn[name];
    if(on){
      fxOn[name] = e.gain;
      const a = make(name);
      if(a.paused){ const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{}); }
    }else{
      delete fxOn[name];
    }
    b.setAttribute("aria-pressed", String(on));
    applyTargets();
  }));
}

function syncAxisChips(){
  document.querySelectorAll(".chip.ax").forEach(c =>
    c.setAttribute("aria-pressed", String(context[c.dataset.axis] === c.dataset.val)));
}

document.body.classList.add("simple");
document.getElementById("detail").addEventListener("click", () => {
  const on = document.body.classList.toggle("simple");
  document.getElementById("detail").setAttribute("aria-pressed", String(!on));
  if(!on) initSpectros();          /* les canvas naissent avec leur vraie largeur */
});

/* Ecran verrouille ou onglet cache : requestAnimationFrame S'ARRETE, et un
   fondu croise en cours gelerait a mi-chemin — deux titulaires a moitie
   audibles jusqu'au retour. Quand la page se cache, chaque piste saute
   IMMEDIATEMENT a son etat final : la musique continue, juste sans rampe. */
document.addEventListener("visibilitychange", () => {
  if(!document.hidden || !playing) return;
  Object.keys(vol).forEach(n => {
    const v = vol[n], a = el[n];
    if(!v || !a) return;
    v.cur = v.target;
    setLevel(n, v.cur);
    if(v.target === 0 && !a.paused && n !== "bed"){
      try{ a.pause(); }catch(e){}
    }
  });
});

buildBoard(); paint();

/* CONTRÔLE AU CHARGEMENT. La panne précédente était invisible : l'interface
   réagissait, les jauges montaient, et il ne sortait qu'un socle. On vérifie
   donc que chaque piste attendue existe VRAIMENT dans le fichier, et on le dit
   à l'écran sinon. */
(function selfCheck(){
  const want = ["bed"];
  (CAST.roles||[]).forEach(r => cands(r).forEach(c => want.push(key(r, c.id))));
  const missing = want.filter(n => data(n) === null);
  if(missing.length){
    say(missing.length + " piste(s) absente(s) du fichier : " +
        missing.slice(0, 3).join(", ") + (missing.length > 3 ? "…" : ""), true);
  }
})();

/* ── transport ─────────────────────────────────────────────────────────── */
playBtn.addEventListener("click", () => {
  if(playing){
    playing = false; applyTargets();
    Object.keys(el).forEach(n => { try{ el[n].pause(); }catch(e){} });
    cancelAnimationFrame(raf); raf = 0; lastTs = 0;
    glyph.textContent = "▶"; playLabel.textContent = "Écouter";
    if(loopTag) loopTag.classList.remove("on"); clock.textContent = "0:00";
    Object.keys(vol).forEach(n => { vol[n].cur = 0; });
    paintLevels();
    return;
  }
  playBtn.disabled = true; playLabel.textContent = "Chargement…";
  /* iOS crée le contexte suspendu : il ne redémarre que dans un geste. */
  const ctx = audioCtx();
  if(ctx && ctx.state === "suspended"){ try{ ctx.resume(); }catch(e){} }
  const ready = unlocked ? Promise.resolve() : unlockAll();
  const bed = make("bed");
  const go = () => {
    playBtn.disabled = false;
    playing = true;
    if(bed.duration){
      durEl.textContent = Math.floor(bed.duration/60)+":"+
        String(Math.round(bed.duration%60)).padStart(2,"0");
    }
    (CAST.roles||[]).forEach(r => startPart(key(r, cast[r])));
    applyTargets();
    glyph.textContent = "❚❚"; playLabel.textContent = "Arrêter";
    if(loopTag) loopTag.classList.add("on");
    /* Affiché pour que le diagnostic soit lisible depuis le téléphone :
       sans nœud de gain, l'appariement des niveaux est écrêté. */
    engineEl.textContent = webGain ? "flux + gain" : "flux seul (gain écrêté)";
    engineEl.classList.toggle("on", !webGain);
    say("");
    if(!raf) raf = requestAnimationFrame(tick);
  };
  ready.then(() => {
    const p = bed.play();
    if(p && p.then) return p.then(go);
    go();
  }).catch(err => {
    playBtn.disabled = false; playLabel.textContent = "Écouter";
    say("Lecture refusée par le navigateur ("+(err && err.name ? err.name : err)+
        "). Touchez à nouveau.", true);
  });
});

if(/iP(hone|ad|od)/.test(navigator.userAgent) ||
   (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent))){
  say("Sur iPhone, le commutateur silencieux coupe le son des pages web. "
    + "S’il n’y a rien : basculez-le.");
}
</script>
