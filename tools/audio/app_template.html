<title>Brocéliande — lecteur</title>
<style>
:root{
  --ink:#0B1512; --panel:#121F1A; --panel-2:#0E1A16; --line:#22352C;
  --fg:#DDE7E2; --fg-2:#9FB3AB; --fg-3:#6C8279;
  --frost:#7FB8AE; --ember:#C8934E;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -18px rgba(0,0,0,.8);
}
@media (prefers-color-scheme:light){
  :root{
    --ink:#E8E4D9; --panel:#F2EFE6; --panel-2:#DCD8CB; --line:#C3BFB0;
    --fg:#14201B; --fg-2:#41544C; --fg-3:#6E8078;
    --frost:#2F7A70; --ember:#8A5C18;
    --shadow:0 1px 2px rgba(20,32,27,.08),0 12px 32px -20px rgba(20,32,27,.35);
  }
}
:root[data-theme="light"]{
  --ink:#E8E4D9; --panel:#F2EFE6; --panel-2:#DCD8CB; --line:#C3BFB0;
  --fg:#14201B; --fg-2:#41544C; --fg-3:#6E8078;
  --frost:#2F7A70; --ember:#8A5C18;
  --shadow:0 1px 2px rgba(20,32,27,.08),0 12px 32px -20px rgba(20,32,27,.35);
}
:root[data-theme="dark"]{
  --ink:#0B1512; --panel:#121F1A; --panel-2:#0E1A16; --line:#22352C;
  --fg:#DDE7E2; --fg-2:#9FB3AB; --fg-3:#6C8279;
  --frost:#7FB8AE; --ember:#C8934E;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 32px -18px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ink);color:var(--fg);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
/* Encoches et coins arrondis : sans les marges de sécurité le texte passe sous
   la barre d'état et sous l'indicateur d'accueil de l'iPhone. */
.wrap{
  max-width:940px;margin:0 auto;
  padding-left:calc(18px + env(safe-area-inset-left));
  padding-right:calc(18px + env(safe-area-inset-right));
}
/* Pas de délai de 300 ms, pas de flash gris au doigt, pas de loupe de sélection
   sur appui long : trois réflexes de Safari mobile qui font paraître l'interface
   molle alors que le code répond tout de suite. */
button{
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}

/* ── en-tête + transport ─────────────────────────────────────── */
header{padding:34px 0 18px}

.bar{
  position:sticky;top:0;z-index:20;background:var(--panel);
  border:1px solid var(--line);border-radius:5px;box-shadow:var(--shadow);
  margin-top:22px;padding:13px 15px;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap;
}
.play{
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  background:var(--frost);color:var(--ink);border:none;border-radius:3px;
  padding:10px 19px;font:600 .92rem/1 inherit;font-family:inherit;
  transition:opacity .15s;
}
@media (hover:hover){.play:hover{opacity:.86}}
.play[disabled]{opacity:.5;cursor:progress}
.clock{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;
  font-variant-numeric:tabular-nums;color:var(--fg-2);
}
.clock b{color:var(--fg);font-weight:600}
.tag{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.63rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3);
  border:1px solid var(--line);border-radius:2px;padding:4px 8px;
}
.tag.on{color:var(--ember);border-color:var(--ember)}
.msg{flex-basis:100%;font-size:.8rem;color:var(--fg-3);line-height:1.5}
.msg:empty{display:none}
.msg.warn{color:var(--ember)}

/* ── la table : une ligne par piste — jauge, titulaire, remplaçants ── */
.board{display:grid;gap:8px}
.track{
  background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:11px 13px 12px;display:grid;gap:9px;box-shadow:var(--shadow);
}
.tr-top{display:flex;align-items:center;gap:12px}
.tr-name{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.62rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3);min-width:54px;
}
.tr-now{
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  font-size:1.08rem;color:var(--ember);flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tr-now .from{color:var(--fg-3)}
.tr-now .arr{color:var(--frost);padding:0 4px}
.meter{width:90px;flex:none}
.track.hot .meter i{background:var(--ember)}
.meter{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{
  display:block;height:100%;width:0%;background:var(--frost);
  border-radius:2px;transition:width .09s linear;
}

/* ── sections ─────────────────────────────────────────────────── */
section{margin-top:30px}

.chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.axis{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:9px}
.axis > b{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.62rem;
  letter-spacing:.15em;text-transform:uppercase;color:var(--fg-3);
  min-width:74px;font-weight:400;
}
.chip{
  cursor:pointer;font:inherit;font-size:.82rem;background:transparent;
  color:var(--fg-2);border:1px solid var(--line);border-radius:2px;
  padding:5px 11px;transition:.14s;
}
@media (hover:hover){.chip:hover{color:var(--fg);border-color:var(--fg-3)}}
.chip[aria-pressed="true"]{
  background:var(--frost);border-color:var(--frost);color:var(--ink);font-weight:500;
}
.chip.amb[aria-pressed="true"]{background:var(--ember);border-color:var(--ember)}

.bench{display:flex;gap:6px;flex-wrap:wrap}
.cand{
  cursor:pointer;font:inherit;font-size:.8rem;background:transparent;
  color:var(--fg-3);border:1px solid var(--line);border-radius:2px;
  padding:4px 10px;transition:.14s;
}
@media (hover:hover){.cand:hover{color:var(--fg);border-color:var(--fg-3)}}
.cand[aria-pressed="true"]{
  background:var(--ember);border-color:var(--ember);color:var(--ink);font-weight:500;
}

a{color:var(--frost)}
button:focus-visible,a:focus-visible{outline:2px solid var(--frost);outline-offset:3px;border-radius:2px}
@media (max-width:640px){
  .meter{width:56px}
  .axis > b{min-width:100%}
  header{padding-top:calc(20px + env(safe-area-inset-top))}
  .bar{top:env(safe-area-inset-top)}
}
/* CIBLES TACTILES. Au doigt, les puces faisaient 28 px de haut — sous le
   minimum de 44x44 px que le projet s'impose (bible §21.1, pilier TACTILE).
   On n'agrandit que sur pointeur grossier : à la souris les puces compactes
   restent préférables. */
@media (pointer:coarse){
  .chip,.cand{min-height:44px;padding:9px 15px;font-size:.86rem}
  .play{min-height:48px;padding:12px 22px}
  .bench{gap:8px}
  .chips,.axis{gap:9px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}

/* ── attestation de provenance ────────────────────────────────── */
.prov{
  margin-top:26px;border:1px solid var(--line);border-radius:4px;
  background:var(--panel);overflow:hidden;
}
.prov-head{
  display:flex;align-items:center;gap:12px;padding:14px 17px;
  background:var(--panel-2);border-bottom:1px solid var(--line);flex-wrap:wrap;
}
.prov-head h3{
  font-family:"Iowan Old Style",Palatino,Georgia,ui-serif,serif;
  font-size:1.02rem;font-weight:600;margin:0;
}
.pill{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.62rem;
  letter-spacing:.13em;text-transform:uppercase;padding:4px 9px;border-radius:2px;
  border:1px solid currentColor;
}
.pill.synth{color:var(--frost)}
.pill.sampled{color:var(--ember)}
.prov-body{padding:16px 17px;display:flex;flex-direction:column;gap:13px}
.prov-body p{font-size:.87rem;color:var(--fg-2);max-width:62ch;margin:0}
.prov-rows{display:flex;flex-direction:column;gap:7px;margin:0}
.prov-rows div{display:grid;grid-template-columns:140px 1fr;gap:14px;font-size:.8rem}
.prov-rows dt{
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.64rem;
  letter-spacing:.11em;text-transform:uppercase;color:var(--fg-3);padding-top:.2em;
}
.prov-rows dd{
  margin:0;font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.76rem;overflow-wrap:anywhere;
}
.prov details{font-size:.8rem}
.prov summary{cursor:pointer;color:var(--fg-3);font-size:.78rem;min-height:44px;
  display:flex;align-items:center}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.prov table{border-collapse:collapse;margin-top:10px;font-size:.74rem}
.prov th,.prov td{
  text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);
  white-space:nowrap;
}
.prov th{color:var(--fg-3);font-weight:400;font-size:.66rem;text-transform:uppercase;
  letter-spacing:.1em}
.prov td.k{font-family:ui-monospace,Menlo,Consolas,monospace}
@media (max-width:720px){.prov-rows div{grid-template-columns:1fr;gap:2px}}
</style>

<div class="wrap">
<header>
  <div class="bar">
    <button class="play" id="play"><span id="glyph">▶</span><span id="playlabel">Écouter</span></button>
    <div class="clock"><b id="t">0:00</b> / <span id="dur">3:16</span></div>
    <div class="tag" id="milieu">milieu · neutre</div>
    <div class="tag" id="engine">—</div>
    <div class="msg" id="msg"></div>
  </div>
</header>

<section><div class="chips" id="presets"></div></section>
<section><div class="board" id="board"></div></section>
<section><div id="axes"></div></section>

</div>

<script>
const AUDIO = __AUDIO_JSON__;
const CAST  = __CASTING_JSON__;

const AXIS_LABEL = {meteo:"Météo", saison:"Saison", moment:"Moment"};
const ROLE_LABEL = {chant:"Chant", corde:"Corde", halo:"Halo", pulse:"Pouls"};

/* Présets COMBINATOIRES : chacun pose des AXES (météo + saison + moment),
   pas une distribution figée. La table de contexte en déduit les titulaires ET
   le milieu — et l'état reste lisible et modifiable axe par axe après coup. */
const PRESETS = [
  {id:"broceliande", label:"Brocéliande",   ctx:{}},
  {id:"pluie",       label:"Pluie d’été",   ctx:{meteo:"pluie", saison:"ete"}},
  {id:"orage",       label:"Orage",         ctx:{meteo:"orage"}},
  {id:"neige",       label:"Neige",         ctx:{meteo:"neige"}},
  {id:"hiver",       label:"Nuit d’hiver",  ctx:{saison:"hiver", moment:"nuit"}},
  {id:"printemps",   label:"Aube claire",   ctx:{moment:"aube"}},
  {id:"lointain",    label:"Brume de nuit", ctx:{meteo:"brume", moment:"nuit"}},
];

const $ = s => document.querySelector(s);
const playBtn=$("#play"), glyph=$("#glyph"), playLabel=$("#playlabel");
const clock=$("#t"), durEl=$("#dur"), msgEl=$("#msg"), engineEl=$("#engine"), loopTag=$("#looptag");

let cast = Object.assign({}, CAST.default);
let context = {};
let playing = false, unlocked = false;
const el = {};            /* nom -> HTMLAudioElement */
const vol = {};           /* nom -> {cur, target} */
let raf = 0, lastSync = 0;

function say(m, warn){ msgEl.textContent = m || ""; msgEl.classList.toggle("warn", !!warn); }
function key(role, id){ return role + "__" + id; }
function cands(role){ return (CAST.candidates && CAST.candidates[role]) || []; }
function entry(role, id){ return cands(role).find(c => c.id === id); }
/* Le gain vient de casting.json : correctif d'appariement mesuré sur les
   fichiers rendus. Sans lui le đàn tranh sort 5 dB sous la guitare. */
function trim(role, id){ const c = entry(role, id); return c && +c.gain ? +c.gain : 1; }

/* ── moteur : des éléments <audio>, pas du Web Audio ────────────────────────
   Décoder quatre pistes de 196 s dans la RAM faisait échouer la page sur
   téléphone, et le repli figeait toute la distribution. Un <audio> diffuse au
   lieu de tout décoder. Ils sont tous « déverrouillés » au premier appui —
   iOS refuse un play() hors geste utilisateur, mais accepte de reprendre un
   élément déjà joué une fois. C'est ce qui rend la bascule possible ensuite. */
/* NŒUD DE GAIN, PAS a.volume. Deux raisons, toutes deux mesurées :

   1. Sur iOS, HTMLMediaElement.volume est EN LECTURE SEULE — l'affectation est
      ignorée sans erreur. Avec a.volume seul, l'ancien titulaire continuait
      donc à sortir à plein niveau pendant les trois secondes du fondu, puis
      se coupait net : on entendait deux instruments à la fois, et le fondu
      croisé n'existait pas sur téléphone.
   2. a.volume est borné à [0,1]. Or six des douze correctifs d'appariement
      dépassent 1 (psaltérion 1,93, đàn tranh 1,66, verres 1,41, oud 1,25,
      kalimba 1,07, ocarina 1,005). Ils étaient tous écrêtés à 1,0 : le
      psaltérion sortait 5,7 dB trop bas, exactement l'écart que match_levels
      avait mesuré et corrigé. L'appariement à 0,00 dB était calculé mais pas
      appliqué.

   Un GainNode accepte les gains > 1 et fonctionne sur iOS. L'élément <audio>
   reste la source : on continue de DIFFUSER, on ne décode pas 196 s en RAM —
   c'est ce décodage qui faisait échouer la page sur téléphone. */
let AC = null, webGain = false;
const gain = {};

function audioCtx(){
  if(AC !== null) return AC;
  const C = window.AudioContext || window.webkitAudioContext;
  if(!C){ AC = false; return AC; }
  try{ AC = new C(); }catch(e){ AC = false; }
  if(AC) buildBus();
  return AC;
}

/* ── LE BUS DE MILIEU ───────────────────────────────────────────────────────
   Changer d'instrument ne suffit pas à changer de monde. Ce qui fait entendre
   un milieu gelé, ce n'est pas seulement un carillon à la place d'une célesta :
   c'est un aigu clairsemé, une queue de réverbe longue et sombre, un grave
   retiré. Le froid s'entend à ce qui manque dans le bas.

   Deux shelfs et une réverbe à réponse impulsionnelle calculée. Tout est
   appliqué À LA LECTURE : on entend le milieu changer sans rien re-rendre.
   Voir docs/80_sound/30_music/MUSICOLOGIE_PRIME.md §4. */
let BUS = null, LOW = null, HIGH = null, WET = null, CONV = null, DRY = null;

function buildBus(){
  const c = AC;
  BUS  = c.createGain();
  LOW  = c.createBiquadFilter(); LOW.type  = "lowshelf";  LOW.frequency.value  = 220;
  HIGH = c.createBiquadFilter(); HIGH.type = "highshelf"; HIGH.frequency.value = 4200;
  DRY  = c.createGain(); WET = c.createGain(); WET.gain.value = 0;
  CONV = c.createConvolver();
  BUS.connect(LOW); LOW.connect(HIGH);
  HIGH.connect(DRY); DRY.connect(c.destination);
  HIGH.connect(CONV); CONV.connect(WET); WET.connect(c.destination);
  applyMix(resolveMix());
}

/* Bruit décroissant, assombri progressivement : une queue dont l'amortissement
   se resserre avec le temps, comme une vraie salle. `damp` fixe la vitesse à
   laquelle l'aigu s'éteint — c'est lui qui distingue une caverne d'un couloir. */
function makeIR(decay, damp){
  const c = AC, n = Math.max(1, Math.floor(c.sampleRate * decay));
  const buf = c.createBuffer(2, n, c.sampleRate);
  const k = Math.exp(-2 * Math.PI * Math.min(damp, c.sampleRate / 2.2) / c.sampleRate);
  for(let ch = 0; ch < 2; ch++){
    const d = buf.getChannelData(ch);
    let z = 0, seed = 1337 + ch * 7919;
    for(let i = 0; i < n; i++){
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;      /* bruit reproductible */
      const white = (seed / 0x3fffffff) - 1;
      z = white * (1 - k) + z * k;                          /* passe-bas 1 pôle */
      d[i] = z * Math.pow(1 - i / n, 2.4);                  /* décroissance */
    }
  }
  return buf;
}

let mixNow = null;
function applyMix(m){
  if(!AC || !BUS || !m) return;
  const t = AC.currentTime, R = 0.6;          /* le milieu glisse, il ne saute pas */
  LOW.gain.setTargetAtTime(m.low, t, R);
  HIGH.gain.setTargetAtTime(m.high, t, R);
  WET.gain.setTargetAtTime(m.space, t, R);
  DRY.gain.setTargetAtTime(1 - 0.35 * m.space, t, R);
  const sig = m.decay + "/" + m.damp;
  if(sig !== mixNow){                          /* l'IR ne se recalcule qu'au besoin */
    try{ CONV.buffer = makeIR(m.decay, m.damp); mixNow = sig; }catch(e){}
  }
  const tag = document.querySelector("#milieu");
  if(tag) tag.textContent = "milieu · " + (m.source || "neutre");
}

/* Même priorité que la distribution : météo > saison > moment. Un seul milieu
   l'emporte — superposer deux traitements d'espace ne veut plus rien dire. */
function resolveMix(){
  const table = CAST.mix || {};
  for(const axis of (CAST.priority || [])){
    const v = context[axis];
    if(v && table[v]) return Object.assign({source:v}, table[v]);
  }
  return Object.assign({source:"neutre"}, CAST.mix_neutral ||
    {low:0, high:0, space:0.16, decay:2.6, damp:5200});
}

/* LE GÉNÉRATEUR PRÉFIXE LES PARTIES DE RÔLE PAR « P_ ». Sans cette résolution,
   AUDIO["chant__flute"] valait undefined, la source devenait la chaîne
   "data:audio/mpeg;base64,undefined" et le navigateur répondait
   MEDIA_ERR_SRC_NOT_SUPPORTED sur les douze parties. Seul le socle sortait —
   et rien ne le montrait, parce que les jauges lisent l'état JS et non l'audio.
   On accepte les deux écritures pour rester compatible des deux gabarits. */
function data(name){
  if(AUDIO[name] !== undefined) return AUDIO[name];
  if(AUDIO["P_" + name] !== undefined) return AUDIO["P_" + name];
  return null;
}

function make(name){
  if(el[name]) return el[name];
  const b64 = data(name);
  const a = new Audio();
  if(b64 === null){
    say("Piste absente du fichier : " + name, true);
    el[name] = a; vol[name] = {cur:0, target:0};
    return a;
  }
  a.src = "data:audio/mpeg;base64," + b64;
  a.loop = true; a.preload = "auto"; a.volume = 0;
  a.playsInline = true; a.setAttribute("playsinline", "");
  el[name] = a; vol[name] = {cur:0, target:0};
  const ctx = audioCtx();
  if(ctx){
    try{
      const src = ctx.createMediaElementSource(a);
      const g = ctx.createGain();
      g.gain.value = 0;
      src.connect(g); g.connect(BUS || ctx.destination);
      gain[name] = g; webGain = true;
      a.volume = 1;                    /* le gain fait le travail en aval */
    }catch(e){ /* pas de graphe : on retombe sur a.volume, écrêté à 1 */ }
  }
  return a;
}

/* Un seul point d'application, pour que le repli soit impossible à oublier. */
function setLevel(name, v){
  const g = gain[name];
  if(g){ try{ g.gain.value = Math.max(0, v); return; }catch(e){} }
  const a = el[name];
  if(a){ try{ a.volume = Math.max(0, Math.min(1, v)); }catch(e){} }
}

/* ATTENDRE LA FIN DU DÉVERROUILLAGE AVANT DE JOUER. La pause de déverrouillage
   part dans un .then() ; en démarrant le socle tout de suite, cette pause
   arrivait APRÈS et remettait en pause le socle qu'on venait de lancer. Le
   symptôme est exactement « on touche Écouter et rien ne se passe » : les
   compteurs tournent, playing vaut true, et le socle est à l'arrêt.
   Rejouer un élément déjà déverrouillé ne demande plus de geste, donc démarrer
   depuis le .then() reste autorisé par iOS. Le délai de garde évite de rester
   bloqué si une promesse ne se règle jamais. */
function unlockAll(){
  const names = ["bed"];
  (CAST.roles||[]).forEach(r => cands(r).forEach(c => names.push(key(r, c.id))));
  const all = names.map(n => {
    const a = make(n);
    const done = () => { try{ a.pause(); a.currentTime = 0; }catch(e){} };
    let p;
    try{ p = a.play(); }catch(e){ done(); return Promise.resolve(); }
    if(p && p.then) return p.then(done).catch(()=>{ done(); });
    done(); return Promise.resolve();
  });
  unlocked = true;
  return Promise.race([
    Promise.all(all),
    new Promise(res => setTimeout(res, 1200)),
  ]);
}

function bedTime(){
  const b = el.bed;
  return b && b.duration ? b.currentTime : 0;
}

function startPart(name){
  const a = make(name);
  if(!a.paused) return;
  try{ a.currentTime = bedTime(); }catch(e){}
  const p = a.play();
  if(p && p.catch) p.catch(()=>{ say("Le navigateur a refusé de démarrer une piste.", true); });
}

function applyTargets(){
  Object.keys(vol).forEach(n => { vol[n].target = 0; });
  if(!playing) return;
  vol.bed = vol.bed || {cur:0, target:0};
  vol.bed.target = 1;
  (CAST.roles||[]).forEach(r => {
    const n = key(r, cast[r]);
    vol[n] = vol[n] || {cur:0, target:0};
    vol[n].target = trim(r, cast[r]);
  });
  /* Couper franchement ce qui est déjà à zéro. Le fondu ne met en pause que ce
     qui DESCEND ; les douze pistes réveillées par le déverrouillage restaient
     donc en lecture à gain nul — inaudibles, mais douze décodages simultanés
     sur la batterie du téléphone. Mesuré : onze pistes actives au lieu de
     quatre. */
  Object.keys(vol).forEach(n => {
    const a = el[n];
    if(!a || n === "bed") return;
    if(vol[n].target === 0 && vol[n].cur <= 0.001 && !a.paused){
      try{ a.pause(); a.currentTime = 0; }catch(e){}
    }
  });
}

let lastTs = 0;
function tick(ts){
  raf = requestAnimationFrame(tick);
  /* TEMPS RÉEL, PAS UN PAS FIXE. En supposant 60 images/s le fondu durait
     3 s seulement si le navigateur tenait vraiment 60 Hz ; dès que la cadence
     tombe — onglet en arrière-plan, défilement, économie d'énergie sur
     téléphone — le fondu s'étirait d'autant. Mesuré à 1,21 au lieu de 1,93
     après 3,6 s sur un rendu ralenti. Le plafond à 0,1 s évite un saut brutal
     au retour d'un onglet resté caché. */
  const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 1/60;
  lastTs = ts;
  /* La pente est rapportée à l'amplitude en jeu, sinon un titulaire à fort
     correctif met plus longtemps : à 1/3 par seconde, atteindre 1,93
     (psaltérion) demandait 5,8 s au lieu de 3. */
  Object.keys(vol).forEach(n => {
    const v = vol[n], a = el[n];
    if(!a) return;
    if(Math.abs(v.cur - v.target) > 0.001){
      const step = Math.max(1, v.target, v.cur) * dt / 3.0;
      v.cur += Math.sign(v.target - v.cur) * Math.min(step, Math.abs(v.target - v.cur));
      setLevel(n, v.cur);
      if(v.cur <= 0.001 && v.target === 0 && !a.paused && n !== "bed") a.pause();
    }
  });

  if(playing && el.bed){
    /* RECALAGE SANS SEEK. L'ancienne version faisait a.currentTime = t sur
       des pistes EN LECTURE dès 80 ms d'écart. Un seek sur un élément qui
       joue est un trou audible — et sur un téléphone qui décode dix-huit
       éléments, les écarts sont fréquents : c'était le « ça coupe », remis
       toutes les deux secondes.
       Une piste audible n'est plus JAMAIS repositionnée : on corrige sa
       VITESSE (±0,3 %, ~5 cents, sous le vibrato des instruments), et le
       seek reste réservé aux pistes inaudibles ou à un décrochage franc
       (>0,6 s), où le trou est de toute façon moindre que le décalage. */
    if(ts - lastSync > 500){
      lastSync = ts;
      const t = el.bed.currentTime, d = el.bed.duration || 1;
      Object.keys(el).forEach(n => {
        if(n === "bed") return;
        const a = el[n];
        if(a.paused || !a.duration) return;
        let diff = a.currentTime - t;
        if(diff >  d/2) diff -= d;
        if(diff < -d/2) diff += d;
        const audible = vol[n] && vol[n].cur > 0.02;
        if(!audible){
          if(Math.abs(diff) > 0.05){ try{ a.currentTime = t; }catch(e){} }
          if(a.playbackRate !== 1) a.playbackRate = 1;
        }else if(Math.abs(diff) > 0.6){
          try{ a.currentTime = t; }catch(e){}
          if(a.playbackRate !== 1) a.playbackRate = 1;
        }else if(Math.abs(diff) > 0.03){
          try{ a.preservesPitch = false; a.webkitPreservesPitch = false; }catch(e){}
          a.playbackRate = 1 - Math.max(-0.003, Math.min(0.003, diff * 0.05));
        }else if(a.playbackRate !== 1){
          a.playbackRate = 1;
        }
      });
    }
    const t = el.bed.currentTime;
    clock.textContent = Math.floor(t/60) + ":" + String(Math.floor(t%60)).padStart(2,"0");
  }
  paintLevels();
}

/* ── interface ─────────────────────────────────────────────────────────── */
const boardEl = $("#board");
const switching = {};          /* role -> minuterie du fondu affiche */

function buildBoard(){
  const rows = [{id:"bed", name:"Socle", fixed:true}]
    .concat((CAST.roles||[]).map(r => ({id:r, name:ROLE_LABEL[r]||r})));
  boardEl.innerHTML = rows.map(r =>
    '<div class="track" data-tr="'+r.id+'">'+
      '<div class="tr-top"><span class="tr-name">'+r.name+'</span>'+
        '<span class="tr-now" data-now="'+r.id+'">'+(r.fixed?"— fixe —":"—")+'</span>'+
        '<span class="meter"><i></i></span></div>'+
      (r.fixed ? "" :
      '<div class="bench">'+ cands(r.id).map(c =>
        '<button class="cand" data-role="'+r.id+'" data-id="'+c.id+'" aria-pressed="false">'+
        c.label+'</button>').join("") +'</div>')+
    '</div>').join("");
  document.querySelectorAll(".cand").forEach(b => b.addEventListener("click", () => {
    context = {}; syncAxisChips();
    const next = Object.assign({}, cast); next[b.dataset.role] = b.dataset.id;
    setCast(next);
  }));
}

function paintLevels(){
  /* La jauge est rapportee au gain nominal du titulaire, pas a 1 : le
     psalterion joue a 1,93 et saturerait la barre des le debut du fondu. */
  const set = (id, name, hot, full) => {
    const box = boardEl.querySelector('.track[data-tr="'+id+'"]');
    if(!box) return;
    const v = vol[name] ? vol[name].cur : 0;
    box.querySelector(".meter i").style.width =
      Math.round(Math.min(1, v / (full || 1)) * 100) + "%";
    box.classList.toggle("hot", !!hot && v > 0.02);
  };
  set("bed", "bed", false, 1);
  (CAST.roles||[]).forEach(r => set(r, key(r, cast[r]), true, trim(r, cast[r])));
}

function sameCtx(a, b){
  return Object.keys(CAST.axes || {}).every(k => (a[k] || null) === (b[k] || null));
}

function paint(){
  document.querySelectorAll(".cand").forEach(b =>
    b.setAttribute("aria-pressed", String(cast[b.dataset.role] === b.dataset.id)));
  (CAST.roles||[]).forEach(r => {
    if(switching[r]) return;             /* la ligne montre « ancien → nouveau » */
    const e = entry(r, cast[r]);
    const now = boardEl.querySelector('[data-now="'+r+'"]');
    if(now && e) now.textContent = e.label;
  });
  document.querySelectorAll(".chip.amb").forEach(b => {
    const pz = PRESETS.find(x => x.id === b.dataset.amb);
    b.setAttribute("aria-pressed", String(!!pz && sameCtx(context, pz.ctx)));
  });
  paintLevels();
}

function setCast(next){
  (CAST.roles||[]).forEach(r => {
    if(cast[r] === next[r]) return;
    const oldE = entry(r, cast[r]), newE = entry(r, next[r]);
    cast[r] = next[r];
    if(playing) startPart(key(r, cast[r]));
    /* pendant le fondu croise, la ligne montre le remplacement en cours */
    const now = boardEl.querySelector('[data-now="'+r+'"]');
    if(now && oldE && newE){
      now.innerHTML = '<span class="from">'+oldE.label+'</span>'+
                      '<span class="arr">→</span>'+newE.label;
      clearTimeout(switching[r]);
      switching[r] = setTimeout(() => { delete switching[r]; paint(); }, 3200);
    }
  });
  applyTargets(); paint(); applyMix(resolveMix());
}

/* Role par role, le premier axe qui se prononce l'emporte ; le titulaire par
   defaut ferme la marche, donc il y a toujours exactement un instrument par role. */
function resolve(){
  const out = Object.assign({}, CAST.default), done = {};
  (CAST.priority||[]).forEach(axis => {
    const v = context[axis]; if(!v) return;
    const m = (CAST.context||{})[v] || {};
    Object.keys(m).forEach(r => { if(!done[r]){ out[r] = m[r]; done[r] = true; } });
  });
  return out;
}

/* presets — combinables avec les axes : un preset POSE des axes, il ne fige rien */
$("#presets").innerHTML = PRESETS.map(pz =>
  '<button class="chip amb" data-amb="'+pz.id+'" aria-pressed="false">'+pz.label+'</button>').join("");
$("#presets").querySelectorAll(".amb").forEach(b => b.addEventListener("click", () => {
  const pz = PRESETS.find(x => x.id === b.dataset.amb);
  context = Object.assign({}, pz.ctx);
  syncAxisChips();
  setCast(resolve());
}));

/* axes */
const axesEl = $("#axes");
Object.keys(CAST.axes || {}).forEach(axis => {
  const row = document.createElement("div");
  row.className = "axis";
  row.innerHTML = "<b>"+(AXIS_LABEL[axis]||axis)+"</b>";
  CAST.axes[axis].forEach(value => {
    const b = document.createElement("button");
    b.className = "chip ax"; b.textContent = value;
    b.setAttribute("aria-pressed","false");
    b.dataset.axis = axis; b.dataset.val = value;
    b.addEventListener("click", () => {
      if(context[axis] === value) delete context[axis];
      else context[axis] = value;
      syncAxisChips();
      setCast(resolve());
    });
    row.appendChild(b);
  });
  axesEl.appendChild(row);
});

function syncAxisChips(){
  document.querySelectorAll(".chip.ax").forEach(c =>
    c.setAttribute("aria-pressed", String(context[c.dataset.axis] === c.dataset.val)));
}

buildBoard(); paint();

/* CONTRÔLE AU CHARGEMENT. La panne précédente était invisible : l'interface
   réagissait, les jauges montaient, et il ne sortait qu'un socle. On vérifie
   donc que chaque piste attendue existe VRAIMENT dans le fichier, et on le dit
   à l'écran sinon. */
(function selfCheck(){
  const want = ["bed"];
  (CAST.roles||[]).forEach(r => cands(r).forEach(c => want.push(key(r, c.id))));
  const missing = want.filter(n => data(n) === null);
  if(missing.length){
    say(missing.length + " piste(s) absente(s) du fichier : " +
        missing.slice(0, 3).join(", ") + (missing.length > 3 ? "…" : ""), true);
  }
})();

/* ── transport ─────────────────────────────────────────────────────────── */
playBtn.addEventListener("click", () => {
  if(playing){
    playing = false; applyTargets();
    Object.keys(el).forEach(n => { try{ el[n].pause(); }catch(e){} });
    cancelAnimationFrame(raf); raf = 0; lastTs = 0;
    glyph.textContent = "▶"; playLabel.textContent = "Écouter";
    if(loopTag) loopTag.classList.remove("on"); clock.textContent = "0:00";
    Object.keys(vol).forEach(n => { vol[n].cur = 0; });
    paintLevels();
    return;
  }
  playBtn.disabled = true; playLabel.textContent = "Chargement…";
  /* iOS crée le contexte suspendu : il ne redémarre que dans un geste. */
  const ctx = audioCtx();
  if(ctx && ctx.state === "suspended"){ try{ ctx.resume(); }catch(e){} }
  const ready = unlocked ? Promise.resolve() : unlockAll();
  const bed = make("bed");
  const go = () => {
    playBtn.disabled = false;
    playing = true;
    if(bed.duration){
      durEl.textContent = Math.floor(bed.duration/60)+":"+
        String(Math.round(bed.duration%60)).padStart(2,"0");
    }
    (CAST.roles||[]).forEach(r => startPart(key(r, cast[r])));
    applyTargets();
    glyph.textContent = "❚❚"; playLabel.textContent = "Arrêter";
    if(loopTag) loopTag.classList.add("on");
    /* Affiché pour que le diagnostic soit lisible depuis le téléphone :
       sans nœud de gain, l'appariement des niveaux est écrêté. */
    engineEl.textContent = webGain ? "flux + gain" : "flux seul (gain écrêté)";
    engineEl.classList.toggle("on", !webGain);
    say("");
    if(!raf) raf = requestAnimationFrame(tick);
  };
  ready.then(() => {
    const p = bed.play();
    if(p && p.then) return p.then(go);
    go();
  }).catch(err => {
    playBtn.disabled = false; playLabel.textContent = "Écouter";
    say("Lecture refusée par le navigateur ("+(err && err.name ? err.name : err)+
        "). Touchez à nouveau.", true);
  });
});

if(/iP(hone|ad|od)/.test(navigator.userAgent) ||
   (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.userAgent))){
  say("Sur iPhone, le commutateur silencieux coupe le son des pages web. "
    + "S’il n’y a rien : basculez-le.");
}
</script>
