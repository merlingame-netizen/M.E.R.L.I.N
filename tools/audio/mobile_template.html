<title>Brocéliande — contrôle mobile</title>
<style>
@property --sky1{syntax:'<color>';inherits:true;initial-value:#0e1712;}
@property --sky2{syntax:'<color>';inherits:true;initial-value:#090f0b;}
@property --glow{syntax:'<color>';inherits:true;initial-value:#c9a25e;}
:root{
  --sky1:#0e1712; --sky2:#090f0b; --glow:#c9a25e;
  --ink:#0a100c; --panel:rgba(16,24,19,.74); --line:#242f26; --line-2:#31402f;
  --fg:#e9e2ce; --fg-2:#a8a893; --fg-3:#6f7565;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  transition:--sky1 1.4s ease,--sky2 1.4s ease,--glow 1.4s ease;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--ink)}
body{
  margin:0;color:var(--fg);background:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(44px + env(safe-area-inset-bottom));
}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;font-family:inherit}
.sky{position:fixed;inset:0;z-index:-2;
  background:radial-gradient(130% 95% at 50% -12%,var(--sky1),var(--sky2) 72%)}
.wrap{max-width:560px;margin:0 auto;
  padding-left:calc(18px + env(safe-area-inset-left));
  padding-right:calc(18px + env(safe-area-inset-right))}
header{padding-top:calc(22px + env(safe-area-inset-top));text-align:center}
.crest{font-size:.8rem;letter-spacing:.45em;color:var(--fg-3)}
h1{margin:4px 0 2px;font-weight:500;font-style:italic;font-size:1.9rem;line-height:1.05}
#milieu{font-style:italic;color:var(--glow);transition:color 1.4s ease}
.bar{
  position:sticky;top:env(safe-area-inset-top);z-index:30;margin-top:14px;
  display:flex;align-items:center;gap:14px;padding:10px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex-wrap:wrap;
}
.play{position:relative;width:56px;height:56px;border-radius:50%;flex:none;
  background:transparent;border:none;color:var(--glow);cursor:pointer;
  display:grid;place-items:center}
.play[disabled]{opacity:.45}
.play svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rrb,.rr{fill:none;stroke-width:2.5}
.rrb{stroke:var(--line-2)}
.rr{stroke:currentColor;stroke-linecap:round;stroke-dasharray:151;stroke-dashoffset:151}
#glyph{font-size:1rem;transform:translateX(1px)}
.clock{font-family:var(--mono);font-size:.9rem;color:var(--fg-2);
  font-variant-numeric:tabular-nums}
.clock b{color:var(--fg)}
.readout{flex-basis:100%;font-family:var(--mono);font-size:.66rem;
  letter-spacing:.06em;color:var(--fg-3);min-height:1em}
.msg{flex-basis:100%;font-size:.8rem;font-style:italic;color:var(--glow)}
.msg:empty{display:none}

section{margin-top:22px}
.lbl{display:flex;align-items:center;gap:12px;margin:0 0 10px;
  font-family:var(--mono);font-weight:400;font-size:.6rem;
  letter-spacing:.3em;text-transform:uppercase;color:var(--fg-3)}
.lbl::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--line-2),transparent)}

/* ── la courbe temporelle ── */
.tl{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px 12px}
#timeline{width:100%;height:96px;display:block;border-radius:8px;
  background:rgba(0,0,0,.3);touch-action:none}
.tl-hint{font-family:var(--mono);font-size:.6rem;color:var(--fg-3);
  letter-spacing:.08em;margin-top:8px}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  background:transparent;border:1px solid var(--line);border-radius:999px;
  color:var(--fg-2);font-family:var(--serif);font-size:.9rem;
  padding:10px 16px;min-height:44px;transition:border-color .15s,color .15s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{color:var(--ink);background:var(--glow);
  border-color:var(--glow);font-weight:600}
.chip .sub{font-family:var(--mono);font-size:.62rem;opacity:.75}
.ic{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.cast-line{font-size:.86rem;font-style:italic;color:var(--fg-2);margin-top:10px;
  line-height:1.6}
.cast-line b{color:var(--glow);font-weight:500;transition:color 1.4s ease}

/* ── journal ── */
.log{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px}
.log-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#entries{list-style:none;margin:0;padding:0;font-family:var(--mono);
  font-size:.72rem;line-height:1.7;color:var(--fg-2);
  -webkit-user-select:text;user-select:text}
#entries li{border-left:2px solid var(--line-2);padding-left:9px;margin-bottom:6px}
#entries li.auto{border-left-color:var(--glow)}
#entries:empty::after{content:"— vide. « Marquer » fige l’instant courant ; les incidents des pistes s’ajoutent tout seuls —";
  font-style:italic;color:var(--fg-3)}
footer{margin-top:26px;text-align:center;font-family:var(--mono);
  font-size:.6rem;letter-spacing:.2em;color:var(--fg-3)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

[data-milieu="clair"]{--sky1:#17220f;--sky2:#0c120a;--glow:#dcbb6d}
[data-milieu="couvert"]{--sky1:#161c14;--sky2:#0d110c;--glow:#adaf8e}
[data-milieu="pluie"]{--sky1:#101b20;--sky2:#0a1013;--glow:#8fb3c2}
[data-milieu="orage"]{--sky1:#171420;--sky2:#0b0a10;--glow:#dda257}
[data-milieu="brume"]{--sky1:#151b19;--sky2:#0e1211;--glow:#a4bfb2}
[data-milieu="neige"]{--sky1:#12202a;--sky2:#0b1218;--glow:#c4dcec}
/* l'heure teinte APRES la meteo (meme specificite : l'ordre gagne) */
[data-heure="aube"]{--sky1:#1d1a14;--glow:#e3c286}
[data-heure="soiree"]{--sky1:#191410;--sky2:#0b0a09}
[data-heure="nuit"]{--sky1:#0a0d16;--sky2:#06070c;--glow:#9aa8cf}
</style>

<div class="sky" aria-hidden="true"></div>
<div class="wrap">
<header>
  <div class="crest">᚛ᚋᚓᚏᚂᚔᚅ᚜</div>
  <h1>Tri Martolod</h1>
  <div><span id="milieu">Brocéliande</span></div>
  <div class="bar">
    <button class="play" id="play" aria-label="Écouter">
      <svg viewBox="0 0 54 54" aria-hidden="true">
        <circle class="rrb" cx="27" cy="27" r="24"/>
        <circle class="rr" id="ring" cx="27" cy="27" r="24"/>
      </svg><span id="glyph">▶</span>
    </button>
    <div class="clock"><b id="t">0:00</b> / <span id="dur">3:16</span> · <span id="ratero">×1.00</span></div>
    <div class="readout" id="readout"></div>
    <div class="msg" id="msg"></div>
  </div>
</header>

<section>
  <h2 class="lbl">Courbe</h2>
  <div class="tl">
    <canvas id="timeline"></canvas>
    <div class="tl-hint">GLISSE POUR EXPLORER · LES TRAITS SONT LES ATTAQUES DÉTECTÉES · TAPE « MARQUER » SUR UN BRUIT</div>
  </div>
</section>

<section>
  <h2 class="lbl">Météo — l’instrument de la mélodie</h2>
  <div class="chips" id="meteo"></div>
  <div class="cast-line" id="castline"></div>
</section>

<section>
  <h2 class="lbl">Heure — la vitesse</h2>
  <div class="chips" id="heure"></div>
  <div class="cast-line" id="heureline"></div>
</section>

<section>
  <h2 class="lbl">Effets</h2>
  <div class="chips" id="fx"></div>
</section>

<section>
  <h2 class="lbl">Journal</h2>
  <div class="log">
    <div class="log-actions">
      <button class="chip" id="mark">✳ Marquer</button>
      <button class="chip" id="copy">Copier le journal</button>
    </div>
    <ol id="entries"></ol>
  </div>
</section>

<footer>᚛ édition de contrôle ᚜</footer>
</div>

<script>
const AUDIO = __AUDIO_JSON__;
const META  = __META_JSON__;

const ICON = {
  clair:'<circle cx="8" cy="8" r="3.1"/><path d="M8 1.4v2M8 12.6v2M1.4 8h2M12.6 8h2M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3"/>',
  couvert:'<path d="M4.6 11.5a3 3 0 1 1 .7-5.9 3.8 3.8 0 0 1 7.4 1.1 2.4 2.4 0 0 1-.5 4.8z"/>',
  pluie:'<path d="M4.6 9.5a3 3 0 1 1 .7-5.9 3.8 3.8 0 0 1 7.4 1.1 2.4 2.4 0 0 1-.5 4.8z"/><path d="M5 12v2.2M8 12.6v2.2M11 12v2.2"/>',
  orage:'<path d="M4.6 9.5a3 3 0 1 1 .7-5.9 3.8 3.8 0 0 1 7.4 1.1 2.4 2.4 0 0 1-.5 4.8z"/><path d="M8.6 9.6l-2.1 3.1h2.2L7.4 15.5"/>',
  brume:'<path d="M2.5 6h11M4 9h9M3 12h10"/>',
  neige:'<path d="M8 2v12M3 5l10 6M13 5L3 11"/>',
  aube:'<path d="M2 11h12M8 11a4 4 0 0 0-8 0z" transform="translate(0,-1)"/><path d="M8 2.5v2.3M3.6 4.6l1.5 1.5M12.4 4.6l-1.5 1.5"/>',
  matinee:'<circle cx="8" cy="9" r="3"/><path d="M8 3.6v1.6M2.6 9h1.6M11.8 9h1.6M4.4 5.4l1.1 1.1M11.6 5.4l-1.1 1.1"/>',
  midi:'<circle cx="8" cy="8" r="3.4"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/>',
  apres_midi:'<circle cx="9" cy="7" r="3"/><path d="M9 1.6v1.6M14 7h-1.6M12.5 3.5l-1.1 1.1M2 13h12"/>',
  soiree:'<path d="M2 11h12M11 11a3 3 0 0 0-6 0"/><path d="M8 5V3.5M4.2 6.8l-1-1M11.8 6.8l1-1"/>',
  nuit:'<path d="M12.6 10.2A5.4 5.4 0 1 1 5.8 3.4a4.4 4.4 0 1 0 6.8 6.8z"/>',
  vent:'<path d="M2 5.5h7a2 2 0 1 0-2-2M2 8.5h10a2 2 0 1 1-2 2M2 11.5h5"/>',
  oiseau:'<path d="M1.5 11c3.5.5 6-1 7.5-4.5M9 6.5C10 4.5 12 4 14 4.5L12.5 6l1.5 1c-2 1.5-4 1.5-5 .5M9 6.5 6 13"/>',
  grillon:'<path d="M3 9a5 5 0 0 1 10 0M5.5 9a2.6 2.6 0 0 1 5 0M8 9v3.5"/>',
};
const icon = n => ICON[n] ? '<svg class="ic" viewBox="0 0 16 16">'+ICON[n]+'</svg>' : '';
const WLABEL = {clair:"clair", couvert:"couvert", pluie:"pluie",
  orage:"orage", brume:"brume", neige:"neige"};
const HLABEL = {aube:"aube", matinee:"matinée", midi:"midi",
  apres_midi:"après-midi", soiree:"soirée", nuit:"nuit"};
const $ = s => document.querySelector(s);

/* ── moteur en COUCHES ─────────────────────────────────────────────────────
   meteo -> la couche CHANT (l'instrument de la melodie) ;
   heure -> playbackRate (hauteur preservee), l'extra eventuel, et la nuit le
   FOND substitue. Jamais plus de 2-3 elements de musique audibles — c'est la
   lecon de la webview iPhone (21 elements = boutons muets, craquements).
   Les fondus passent par des noeuds de gain Web Audio (volume est en lecture
   seule sur iOS) ; sans Web Audio, bascule franche — moins jolie, jamais
   muette. */
let AC = null; const el = {}, gain = {};
let W = "couvert", H = "apres_midi";
let RATE = META.tempo[H] || 1.0;
let playing = false, pos = 0;
const layers = {fond: null, chant: null, extra: null};   /* noms d'elements */
const fadeTok = {fond: 0, chant: 0, extra: 0};
const fxOn = {};

const fondId  = () => H === "nuit" ? "nuit" : "jour";
const extraOf = h => (META.extras[h] || null);

function ctx(){
  if(AC !== null) return AC;
  const C = window.AudioContext || window.webkitAudioContext;
  try{ AC = C ? new C() : false; }catch(e){ AC = false; }
  return AC;
}
function make(name){
  if(el[name]) return el[name];
  const a = new Audio();
  a.loop = !(name === "FX_tonnerre");
  a.preload = "auto";
  try{ a.preservesPitch = true; }catch(e){}
  try{ a.webkitPreservesPitch = true; }catch(e){}
  if(!name.startsWith("FX_")) a.playbackRate = RATE;
  a.src = "data:audio/mpeg;base64," + (AUDIO[name] || "");
  el[name] = a;
  const c = ctx();
  if(c){
    try{
      const src = c.createMediaElementSource(a);
      const g = c.createGain(); g.gain.value = 0;
      src.connect(g); g.connect(c.destination);
      gain[name] = g;
    }catch(e){}
  }
  /* tout incident d'une piste entre au journal TOUT SEUL */
  ["error", "stalled"].forEach(ev =>
    a.addEventListener(ev, () => {
      if(ev === "error" || playing)
        logAuto("piste " + name + " : " + ev +
                (a.error ? " (code " + a.error.code + ")" : ""));
    }));
  return a;
}
function setG(name, v){
  if(gain[name]){ try{ gain[name].gain.value = v; return; }catch(e){} }
  const a = el[name]; if(a){ try{ a.volume = Math.min(1, v); }catch(e){} }
}
function master(){ return layers.fond ? el[layers.fond] : null; }
function curTime(){ const m = master(); return m ? (m.currentTime || 0) : pos; }

/* fondu croise d'UNE couche — les autres ne bougent pas */
function swapLayer(layer, name, inGesture){
  const prev = layers[layer];
  if(prev === name) return;
  layers[layer] = name;
  if(!playing){ return; }
  const tok = ++fadeTok[layer];
  const t0 = performance.now();
  if(name){
    const a = make(name);
    a.playbackRate = RATE;
    try{ a.currentTime = curTime(); }catch(e){}
    const p = a.play();               /* DANS le geste : iOS l'accepte */
    if(p && p.catch) p.catch(err => logAuto("refus de lecture " + name + " : " + err.name));
  }
  function step(){
    if(fadeTok[layer] !== tok) return;
    const k = Math.min(1, (performance.now() - t0) / 1200);
    if(name) setG(name, k);
    if(prev) setG(prev, 1 - k);
    if(k < 1){ requestAnimationFrame(step); }
    else if(prev && el[prev]){ el[prev].pause(); }
  }
  requestAnimationFrame(step);
}

/* rampe de vitesse — 0,8 s, appliquee a toutes les couches en lecture */
let rateTok = 0;
function rampRate(target){
  const tok = ++rateTok, from = RATE, t0 = performance.now();
  $("#ratero").textContent = "×" + target.toFixed(2);
  function step(){
    if(rateTok !== tok) return;
    const k = Math.min(1, (performance.now() - t0) / 800);
    RATE = from + (target - from) * k;
    ["fond", "chant", "extra"].forEach(l => {
      if(layers[l] && el[layers[l]]) el[layers[l]].playbackRate = RATE;
    });
    if(k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function paintState(){
  document.documentElement.dataset.milieu = W;
  document.documentElement.dataset.heure = H;
  $("#milieu").textContent = WLABEL[W] + " · " + HLABEL[H];
  document.querySelectorAll("#meteo .chip").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.w === W)));
  document.querySelectorAll("#heure .chip").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.h === H)));
  const x = extraOf(H);
  $("#castline").innerHTML = "mélodie <b>" + META.chant[W] + "</b>";
  $("#heureline").innerHTML =
    "vitesse <b>×" + (META.tempo[H] || 1).toFixed(2) + "</b>" +
    " &nbsp;·&nbsp; fond <b>" + META.fonds[fondId()] + "</b>" +
    (x ? " &nbsp;·&nbsp; en plus <b>" + x.label + "</b>" : "");
  drawTimeline();
}

function setMeteo(w){
  W = w; paintState();
  swapLayer("chant", "CHANT_" + w, true);
}
function setHeure(h){
  H = h; paintState();
  rampRate(META.tempo[h] || 1.0);
  swapLayer("fond", "FOND_" + fondId(), true);
  const x = extraOf(h);
  swapLayer("extra", x ? "ADD_" + x.id : null, true);
}

/* ── transport ── */
const playBtn = $("#play"), glyph = $("#glyph");
playBtn.addEventListener("click", () => {
  const c = ctx(); if(c && c.state === "suspended"){ try{ c.resume(); }catch(e){} }
  if(playing){
    pos = curTime();
    playing = false; glyph.textContent = "▶";
    Object.values(el).forEach(a => { try{ a.pause(); }catch(e){} });
    return;
  }
  playing = true; glyph.textContent = "❚❚";
  layers.fond = "FOND_" + fondId();
  layers.chant = "CHANT_" + W;
  const x = extraOf(H);
  layers.extra = x ? "ADD_" + x.id : null;
  let first = null;
  ["fond", "chant", "extra"].forEach(l => {
    if(!layers[l]) return;
    const a = make(layers[l]);
    a.playbackRate = RATE;
    try{ a.currentTime = pos; }catch(e){}
    setG(layers[l], 1);
    const p = a.play();
    if(p && p.catch && !first){ first = p.catch(err => {
      playing = false; glyph.textContent = "▶";
      $("#msg").textContent = "Lecture refusée (" + err.name + "). Retouche ▶.";
      logAuto("refus de lecture initial : " + err.name);
    }); }
    else if(p && p.catch) p.catch(()=>{});
  });
  Object.keys(fxOn).forEach(n => { const f = make(n);
    if(f.paused){ const q = f.play(); if(q && q.catch) q.catch(()=>{}); } });
  if(!raf) raf = requestAnimationFrame(tick);
});

/* ── tenue de synchronisation ──────────────────────────────────────────────
   Le fond est l'horloge. Chant et extra sont PILOTES par leur playbackRate
   (± 0,4 %), jamais par des seeks — un seek s'entend, un pilotage non. Au
   bouclage la derive apparente saute d'une duree : on la replie modulo la
   boucle avant de juger. Au-dela de 300 ms on recale d'un coup (et on le
   consigne : c'est un defaut a entendre). */
function steer(){
  const m = master(); if(!m || !playing) return;
  const d = m.duration || 196;
  ["chant", "extra"].forEach(l => {
    const n = layers[l]; if(!n || !el[n]) return;
    const a = el[n]; if(a.paused) return;
    let drift = (a.currentTime || 0) - (m.currentTime || 0);
    if(drift > d / 2) drift -= d;
    if(drift < -d / 2) drift += d;
    if(Math.abs(drift) > 0.3){
      try{ a.currentTime = m.currentTime; }catch(e){}
      logAuto("recalage " + n + " (dérive " + (drift * 1000 | 0) + " ms)");
    }else{
      a.playbackRate = RATE * (1 - Math.max(-0.004, Math.min(0.004, drift / 5)));
    }
  });
  m.playbackRate = RATE;
}

let raf = 0, lastDraw = 0, lastSteer = 0;
function tick(ts){
  raf = requestAnimationFrame(tick);
  const m = master(); if(!m) return;
  const t = m.currentTime || 0, d = m.duration || 196;
  $("#t").textContent = (t/60|0) + ":" + String(t%60|0).padStart(2,"0");
  const ring = $("#ring");
  if(ring) ring.style.strokeDashoffset = (151 * (1 - t/d)).toFixed(1);
  if(ts - lastSteer > 500){ lastSteer = ts; steer(); }
  if(ts - lastDraw > 200){ lastDraw = ts; drawTimeline(); updateReadout(t); }
}

/* ── courbe temporelle ─────────────────────────────────────────────────── */
const cv = $("#timeline"); let cvW = 0, cvH = 0;
function sizeCanvas(){
  cvW = cv.clientWidth || 320; cvH = 96;
  cv.width = cvW * (devicePixelRatio || 1); cv.height = cvH * (devicePixelRatio || 1);
  cv.getContext("2d").scale(devicePixelRatio || 1, devicePixelRatio || 1);
}
function glowColor(){
  return getComputedStyle(document.documentElement).getPropertyValue("--glow").trim() || "#c9a25e";
}
function combo(){ return META.combos[fondId() + "|" + W]; }
function drawTimeline(){
  const m = combo(); if(!m || !cvW) return;
  const g = cv.getContext("2d");
  g.clearRect(0, 0, cvW, cvH);
  const N = m.curve.length, gl = glowColor();
  /* enveloppe */
  g.beginPath(); g.moveTo(0, cvH);
  for(let i = 0; i < N; i++)
    g.lineTo(i / (N - 1) * cvW, cvH - (m.curve[i] / 100) * (cvH - 12));
  g.lineTo(cvW, cvH); g.closePath();
  g.fillStyle = gl + "33"; g.fill();
  g.strokeStyle = gl; g.lineWidth = 1.2; g.stroke();
  /* marqueurs d'attaques */
  const a = master(), d = (a && a.duration) || 196;
  g.strokeStyle = "rgba(233,226,206,.5)";
  m.onsets.forEach(([t, s]) => {
    const x = t / d * cvW, h = Math.min(1, s / 18) * 22 + 5;
    g.beginPath(); g.moveTo(x, 2); g.lineTo(x, 2 + h); g.stroke();
  });
  /* mesures (une graduation toutes les 4) */
  g.strokeStyle = "rgba(111,117,101,.35)";
  for(let b = 4; b < META.bars; b += 4){
    const x = b * META.bar / d * cvW;
    g.beginPath(); g.moveTo(x, cvH - 8); g.lineTo(x, cvH); g.stroke();
  }
  /* tete de lecture */
  const t = playing || pos ? curTime() : 0;
  const x = t / d * cvW;
  g.strokeStyle = "#e9e2ce"; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(x, 0); g.lineTo(x, cvH); g.stroke();
}
function seekAt(clientX){
  const r = cv.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  const m = master() || make("FOND_" + fondId());
  const d = m.duration || 196;
  pos = frac * d;
  try{ m.currentTime = pos; }catch(e){}
  ["chant", "extra"].forEach(l => {
    if(layers[l] && el[layers[l]]){
      try{ el[layers[l]].currentTime = pos; }catch(e){}
    }
  });
  drawTimeline(); updateReadout(pos);
}
cv.addEventListener("pointerdown", e => { cv.setPointerCapture(e.pointerId); seekAt(e.clientX); });
cv.addEventListener("pointermove", e => { if(e.buttons) seekAt(e.clientX); });

function barAt(t){ return Math.min(META.bars, Math.floor(t / META.bar) + 1); }
function stateLine(){
  const x = extraOf(H);
  return "mélodie:" + META.chant[W] + " · fond:" + META.fonds[fondId()] +
         (x ? " · +" + x.label : "");
}
function updateReadout(t){
  const b = barAt(t);
  const chord = META.progression[b - 1] || "—";
  $("#readout").textContent =
    "t=" + t.toFixed(1) + "s · mesure " + b + " · " + chord +
    " · ×" + RATE.toFixed(2) + " · " + stateLine();
}

/* ── meteo & heure ── */
$("#meteo").innerHTML = META.meteos.map(w =>
  '<button class="chip" data-w="' + w + '" aria-pressed="false">' +
  icon(w) + '<span>' + WLABEL[w] + '</span></button>').join("");
document.querySelectorAll("#meteo .chip").forEach(b =>
  b.addEventListener("click", () => setMeteo(b.dataset.w)));

$("#heure").innerHTML = META.heures.map(h =>
  '<button class="chip" data-h="' + h + '" aria-pressed="false">' +
  icon(h) + '<span>' + HLABEL[h] +
  ' <span class="sub">×' + (META.tempo[h] || 1).toFixed(2) + '</span></span></button>').join("");
document.querySelectorAll("#heure .chip").forEach(b =>
  b.addEventListener("click", () => setHeure(b.dataset.h)));

/* ── effets ── */
$("#fx").innerHTML = (META.sfx || []).map(e =>
  '<button class="chip" data-fx="' + e.id + '" aria-pressed="false">' +
  icon(e.ic) + '<span>' + e.label + '</span></button>').join("");
document.querySelectorAll("#fx .chip").forEach(b => b.addEventListener("click", () => {
  const e = META.sfx.find(x => x.id === b.dataset.fx);
  const name = "FX_" + e.id, a = make(name);
  if(!e.loop){
    setG(name, e.gain); try{ a.currentTime = 0; }catch(err){}
    const p = a.play(); if(p && p.catch) p.catch(()=>{});
    b.setAttribute("aria-pressed", "true");
    setTimeout(() => b.setAttribute("aria-pressed", "false"), 1300);
    return;
  }
  const on = !fxOn[name];
  if(on){
    fxOn[name] = 1; setG(name, e.gain);
    if(playing){ const p = a.play(); if(p && p.catch) p.catch(()=>{}); }
  }else{ delete fxOn[name]; setG(name, 0); a.pause(); }
  b.setAttribute("aria-pressed", String(on));
}));

/* ── journal ─────────────────────────────────────────────────────────────
   Le but de cette page : que tu puisses me DIRE ce qui fait defaut.
   « Marquer » fige l'instant ; les incidents des pistes s'ajoutent seuls. */
const entries = [];
function fmt(t){ return (t/60|0) + ":" + (t % 60).toFixed(1).padStart(4, "0"); }
function tag(){ return "[" + WLABEL[W] + " · " + HLABEL[H] + " ×" + RATE.toFixed(2) + "]"; }
function addEntry(text, auto){
  entries.push(text);
  const li = document.createElement("li");
  if(auto) li.className = "auto";
  li.textContent = text;
  $("#entries").appendChild(li);
}
function logAuto(what){
  addEntry("⚠ " + fmt(curTime()) + " " + tag() + " " + what, true);
}
$("#mark").addEventListener("click", () => {
  const t = curTime(), b = barAt(t);
  addEntry("✳ " + fmt(t) + " " + tag() + " mesure " + b + " (" +
           (META.progression[b - 1] || "—") + ") — " + stateLine());
});
$("#copy").addEventListener("click", () => {
  const text = entries.join("\n") || "(journal vide)";
  const done = () => { $("#msg").textContent = "Journal copié — colle-le dans la conversation."; };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
  else fallbackCopy(text, done);
});
function fallbackCopy(text, done){
  const ta = document.createElement("textarea");
  ta.value = text; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); done();
}

document.addEventListener("visibilitychange", () => {
  if(document.hidden){ logAuto("page cachée (écran verrouillé ?)"); }
  else if(playing){
    /* au retour, recaler les esclaves d'un coup — rAF etait gele */
    const m = master();
    if(m) ["chant", "extra"].forEach(l => {
      if(layers[l] && el[layers[l]]){
        try{ el[layers[l]].currentTime = m.currentTime; }catch(e){}
      }
    });
  }
});

sizeCanvas(); paintState();
$("#ratero").textContent = "×" + RATE.toFixed(2);
addEventListener("resize", () => { sizeCanvas(); drawTimeline(); });
</script>
