<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M.E.R.L.I.N — Fleet Control</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --bd:#30363d; --tx:#e6edf3; --mut:#8b949e;
            --up:#2ea043; --down:#f85149; --pend:#9e6a03; --acc:#58a6ff; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--tx);
           font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    header { padding:18px 24px; border-bottom:1px solid var(--bd); display:flex; gap:16px; align-items:baseline; }
    h1 { font-size:18px; margin:0; } h2 { font-size:14px; color:var(--mut); margin:24px 24px 8px; text-transform:uppercase; letter-spacing:1px; }
    .sub { color:var(--mut); font-size:12px; }
    .grid { display:grid; gap:14px; padding:8px 24px; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); }
    .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:14px; border-left:4px solid var(--mut); }
    .card.up{border-left-color:var(--up)} .card.down{border-left-color:var(--down)} .card.pending{border-left-color:var(--pend)}
    .row{display:flex;justify-content:space-between;align-items:center}
    .name{font-weight:700} .prov{color:var(--mut);font-size:12px} .role{font-size:12.5px;margin:6px 0}
    .badge{font-size:11px;padding:2px 8px;border-radius:20px;text-transform:uppercase}
    .badge.up{background:rgba(46,160,67,.15);color:var(--up)} .badge.down{background:rgba(248,81,73,.15);color:var(--down)}
    .badge.pending{background:rgba(158,106,3,.15);color:var(--pend)}
    .metrics{display:flex;gap:12px;flex-wrap:wrap;color:var(--mut);font-size:12px;margin-top:6px}
    .metrics b{color:var(--tx)}
    .bar{height:6px;border-radius:4px;background:#21262d;margin-top:8px;overflow:hidden}
    .bar > i{display:block;height:100%;background:var(--up)}
    .bar.warn > i{background:var(--pend)} .bar.crit > i{background:var(--down)}
    .qline{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:8px}
    table{width:calc(100% - 48px);margin:8px 24px;border-collapse:collapse}
    td,th{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px}
    th{color:var(--mut);font-weight:600;text-transform:uppercase;font-size:11px}
    button{background:var(--acc);color:#0d1117;border:0;border-radius:6px;padding:5px 12px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5;cursor:wait}
    .res{font-size:12px;color:var(--mut)} .res.ok{color:var(--up)} .res.err{color:var(--down)}
    footer{color:var(--mut);font-size:12px;padding:16px 24px}
    code{color:var(--acc)}
  </style>
</head>
<body>
  <header>
    <h1>🛰️ M.E.R.L.I.N — Fleet Control</h1>
    <span class="sub" id="summary">chargement…</span>
  </header>

  <h2>Nœuds</h2>
  <div class="grid" id="grid"></div>

  <h2>Jobs — dispatch sur le meilleur nœud gratuit</h2>
  <table id="jobs"><thead><tr><th>Job</th><th>Besoins</th><th>Nœud cible</th><th>Action</th><th>Résultat</th></tr></thead><tbody></tbody></table>

  <footer id="foot"></footer>

  <script>
    let QUOTA = {}, PLAN = {};
    const metric = (l,v) => v ? `<span>${l} <b>${v}</b></span>` : "";
    function gauge(pct){ const c = pct>=90?"crit":pct>=70?"warn":""; return `<div class="bar ${c}"><i style="width:${Math.min(pct,100)}%"></i></div>`; }

    async function refreshNodes(){
      const [s,q] = await Promise.all([fetch("/api/status").then(r=>r.json()), fetch("/api/quota").then(r=>r.json())]);
      QUOTA = q.nodes || {};
      document.getElementById("summary").textContent = `${s.up}/${s.total} en ligne · maj ${s.checked_at}`;
      document.getElementById("grid").innerHTML = (s.targets||[]).map(t=>{
        const qn = QUOTA[t.name]||{}; let q = "";
        if(qn.ram_pct!=null) q += `<div class="qline"><span>RAM free-tier</span><span>${qn.ram_pct}%</span></div>${gauge(qn.ram_pct)}`;
        if(qn.req_pct!=null) q += `<div class="qline"><span>Requêtes/jour</span><span>${qn.req_pct}%</span></div>${gauge(qn.req_pct)}`;
        return `<div class="card ${t.state}">
          <div class="row"><span class="name">${t.name}</span><span class="badge ${t.state}">${t.state}</span></div>
          <div class="prov">${t.provider} · ${t.type}</div>
          <div class="role">${t.role||""}</div>
          <div class="metrics">${metric("CPU",t.cpu)} ${metric("RAM",t.mem)} ${metric("Disk",t.disk)} ${metric("⏱",t.latency_ms!=null?t.latency_ms+"ms":"")}</div>
          ${q}
          <div class="res">${t.detail||""}</div></div>`;
      }).join("");
    }

    async function refreshJobs(){
      const j = await fetch("/api/jobs").then(r=>r.json());
      const tb = document.querySelector("#jobs tbody");
      tb.innerHTML = (j.jobs||[]).map(job=>`
        <tr>
          <td><b>${job.name}</b></td>
          <td>${(job.needs||[]).join(", ")}</td>
          <td id="tgt-${job.name}" class="res">—</td>
          <td><button onclick="runJob('${job.name}')" id="btn-${job.name}">Run ▶</button></td>
          <td id="res-${job.name}" class="res"></td>
        </tr>`).join("");
    }

    async function runJob(name){
      const btn=document.getElementById("btn-"+name), res=document.getElementById("res-"+name);
      btn.disabled=true; res.textContent="…"; res.className="res";
      try{
        const r = await fetch("/api/run/"+name,{method:"POST"}).then(r=>r.json());
        const d = r.data||{};
        document.getElementById("tgt-"+name).textContent = d.node || "—";
        if(r.status==="ok"){ res.textContent = "✓ "+(d.detail||"ok")+" @"+d.node; res.className="res ok"; }
        else { res.textContent = "✗ "+(r.error||"refusé"); res.className="res err"; }
      }catch(e){ res.textContent="✗ "+e; res.className="res err"; }
      btn.disabled=false; refreshNodes();
    }

    refreshNodes(); refreshJobs();
    setInterval(refreshNodes, 30000);
    document.getElementById("foot").textContent = "Rafraîchissement nœuds 30s · dispatch local (SSH/HTTP depuis ce PC) · garde-fou free-tier strict.";
  </script>
</body>
</html>
