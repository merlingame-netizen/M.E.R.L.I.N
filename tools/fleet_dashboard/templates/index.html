<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M.E.R.L.I.N — Fleet Admin</title>
  <style>
    :root { --bg:#0d1117; --card:#161b22; --bd:#30363d; --tx:#e6edf3; --mut:#8b949e;
            --up:#2ea043; --down:#f85149; --pend:#9e6a03; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--tx);
           font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    header { padding:18px 24px; border-bottom:1px solid var(--bd);
             display:flex; align-items:baseline; gap:16px; }
    h1 { font-size:18px; margin:0; }
    .sub { color:var(--mut); font-size:12px; }
    .grid { display:grid; gap:16px; padding:24px;
            grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); }
    .card { background:var(--card); border:1px solid var(--bd); border-radius:10px;
            padding:16px; border-left:4px solid var(--mut); }
    .card.up { border-left-color:var(--up); }
    .card.down { border-left-color:var(--down); }
    .card.pending { border-left-color:var(--pend); }
    .row { display:flex; justify-content:space-between; align-items:center; }
    .name { font-weight:700; font-size:15px; }
    .badge { font-size:11px; padding:2px 8px; border-radius:20px; text-transform:uppercase; }
    .badge.up { background:rgba(46,160,67,.15); color:var(--up); }
    .badge.down { background:rgba(248,81,73,.15); color:var(--down); }
    .badge.pending { background:rgba(158,106,3,.15); color:var(--pend); }
    .prov { color:var(--mut); font-size:12px; }
    .role { margin:8px 0; color:var(--tx); font-size:13px; }
    .metrics { display:flex; gap:14px; flex-wrap:wrap; color:var(--mut); font-size:12px; margin-top:8px; }
    .metrics b { color:var(--tx); font-weight:600; }
    .detail { color:var(--mut); font-size:11px; margin-top:8px; }
    footer { color:var(--mut); font-size:12px; padding:0 24px 24px; }
  </style>
</head>
<body>
  <header>
    <h1>🛰️ M.E.R.L.I.N — Fleet Admin</h1>
    <span class="sub" id="summary">chargement…</span>
  </header>
  <div class="grid" id="grid"></div>
  <footer id="foot"></footer>

  <script>
    function metric(label, val){ return val ? `<span>${label} <b>${val}</b></span>` : ""; }
    async function refresh(){
      try {
        const r = await fetch("/api/status"); const d = await r.json();
        document.getElementById("summary").textContent =
          `${d.up}/${d.total} en ligne · maj ${d.checked_at}`;
        const grid = document.getElementById("grid");
        grid.innerHTML = (d.targets||[]).map(t => `
          <div class="card ${t.state}">
            <div class="row">
              <span class="name">${t.name}</span>
              <span class="badge ${t.state}">${t.state}</span>
            </div>
            <div class="prov">${t.provider} · ${t.type}</div>
            <div class="role">${t.role||""}</div>
            <div class="metrics">
              ${metric("CPU", t.cpu)} ${metric("RAM", t.mem)} ${metric("Disk", t.disk)}
              ${metric("⏱", t.latency_ms!=null ? t.latency_ms+"ms" : "")}
            </div>
            <div class="detail">${t.detail||""}</div>
          </div>`).join("");
        document.getElementById("foot").textContent =
          "Rafraîchissement auto toutes les 30 s · données 100% locales (SSH/HTTP depuis ce PC).";
      } catch(e){ document.getElementById("summary").textContent = "erreur: " + e; }
    }
    refresh(); setInterval(refresh, 30000);
  </script>
</body>
</html>
