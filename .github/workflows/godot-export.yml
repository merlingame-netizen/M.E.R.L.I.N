name: Godot Export & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'tools/autodev/**'
      - '*.md'
      - 'memory/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "godot-export"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.5"

jobs:
  export-web:
    name: Export Godot Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: barichello/godot-ci:4.5
    steps:
      - uses: actions/checkout@v4

      - name: Prepare project for headless CI
        run: |
          set -euo pipefail

          # Les templates d'export sont la ou barichello/godot-ci ne les cherche pas.
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

          # La GDExtension merlin_llm ne declare qu'une DLL Windows : elle n'a
          # aucun sens en web, et Godot echoue a la charger.
          rm -f addons/merlin_llm/merlin_llm.gdextension \
                addons/merlin_llm/merlin_llm.gdextension.uid

          # Les plugins EDITEUR ne servent pas a l'export et le serveur MCP
          # bloque sur le port 9080 en CI. L'export n'en a pas besoin.
          sed -i '/\[editor_plugins\]/,/^$/d' project.godot

          # --- Ce que ce script ne fait PLUS, et pourquoi -------------------
          # Il retirait AUSSI tous les autoloads de project.godot, le theme
          # custom, et patchait les shaders. Le commentaire d'origine affirmait
          # que « le .pck contiendra quand meme les scripts d'autoload, ils se
          # chargent au runtime » : c'est faux. Les autoloads sont declares
          # dans project.godot, que l'export embarque tel quel. Les retirer
          # produisait un build qui demarre SANS GameManager, MerlinVisual,
          # SFXManager ni GameFlow — un jeu qui plante a la premiere ligne.
          # Un build qui ne tourne pas est pire qu'un build qui ne sort pas.

          echo "=== autoloads conserves ==="
          grep -c '="\*res://' project.godot

      - name: Verifier que le projet n'a pas ete ampute
        run: |
          set -euo pipefail
          n=$(grep -c '="\*res://' project.godot || echo 0)
          if [ "$n" -lt 25 ]; then
            echo "::error::$n autoloads seulement — le projet a ete ampute, le build serait mort-ne"
            exit 1
          fi
          grep -q 'theme/custom=' project.godot \
            || echo "::warning::pas de theme custom declare"
          echo "OK : $n autoloads, projet intact"

      - name: Import resources
        continue-on-error: true
        timeout-minutes: 20
        run: timeout 900 godot --headless -v --import || true

      - name: Web Export
        timeout-minutes: 60
        run: |
          mkdir -v -p web-export
          timeout 3300 godot --headless --export-release "Web" web-export/index.html || true
          echo "=== Result ==="
          ls -la web-export/
          if [ ! -f web-export/index.html ]; then
            echo "::error::Export failed"
            exit 1
          fi
          # Poids du build : c'est ce que telechargera un mobile.
          total=$(du -sk web-export | cut -f1)
          echo "### Build web : $((total / 1024)) Mo" >> "$GITHUB_STEP_SUMMARY"
          du -h web-export/* | sort -rh | head -10 >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt 102400 ]; then
            echo "::warning::build de $((total / 1024)) Mo — lourd pour du mobile"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: web-export/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-export/

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: export-web
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-export
          path: web-export/
      - name: Deploy
        working-directory: web-export
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel@latest
          CLEAN_TOKEN=$(echo "$VERCEL_TOKEN" | tr -d '[:space:]')
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel deploy --prod --yes --force --token="$CLEAN_TOKEN"

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: export-web
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
