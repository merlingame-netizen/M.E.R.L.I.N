name: Deploy Fly service

# Builds + deploys the Fly.io node from GitHub's runners (not behind the
# sandbox proxy that blocks Fly's builder). Requires repo secret FLY_API_TOKEN.
on:
  workflow_dispatch: {}
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm, main]
    paths:
      - infra/fleet/flyio/**
      - .github/workflows/fly-deploy.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: flyctl deploy
        working-directory: infra/fleet/flyio
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --ha=false
