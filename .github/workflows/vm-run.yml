# LE PONT VERS LA VM — executer une commande sur merlin-arm-a1 sans qu'aucun secret ne
# transite par la conversation (regle absolue depuis l'incident de la cle API Oracle).
#
# Fonctionnement : un fichier infra/vm-run/cmd-NNN-nom.sh pousse sur cette branche declenche
# ce workflow ; il execute le script sur la VM par SSH (cle = secret VM_SSH_KEY, pose par
# Maxime dans Settings > Secrets, JAMAIS dans le chat) et commite la sortie complete dans
# infra/vm-run/resultats/ — lisible ensuite par l'API. Chaque commande est un fichier
# commite : le pont est AUDITABLE (historique git complet) et REVOCABLE (supprimer le secret).
#
# L'UTILISATEUR SE DECOUVRE TOUT SEUL : la VM est un Oracle Linux 9. `ocarun` (le compte de
# Run Command, celui des agents) est en /usr/sbin/nologin — il ne recevra JAMAIS de SSH, quelle
# que soit la cle. Le compte de connexion est `opc`.
#
# QUAND AUCUN COMPTE N'ACCEPTE LA CLE, on ne rend plus une erreur muette : on publie le type,
# la taille et l'empreinte de la cle du secret, sa CLE PUBLIQUE derivee (celle qu'il faut
# installer, a l'octet pres), et le dialogue verbeux de sshd. Une cle publique n'est pas un
# secret ; c'est meme le seul moyen de sortir d'un refus sans deviner.
name: vm-run
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/vm-run/cmd-*.sh"]
permissions:
  contents: write
concurrency:
  group: vm-run
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
      - name: Executer la derniere commande et committer la sortie
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -u
          if [ -z "${VM_SSH_KEY:-}" ]; then
            echo "secret VM_SSH_KEY absent — pont inactif. Bootstrap : infra/vm-run/README.md"
            exit 0
          fi
          CMD="$(ls infra/vm-run/cmd-*.sh 2>/dev/null | sort | tail -1)"
          [ -n "$CMD" ] || { echo "aucune commande en attente"; exit 0; }
          N="$(basename "$CMD" .sh)"
          if [ -f "infra/vm-run/resultats/$N.txt" ]; then
            echo "deja executee ($N) — une commande = une execution"
            exit 0
          fi
          mkdir -p ~/.ssh infra/vm-run/resultats
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          H="${VM_HOST:-141.253.124.75}"
          SSHO="-i $HOME/.ssh/id_vm -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"
          UTIL=""
          for U in ${VM_USER:-} opc ocarun ubuntu; do
            [ -n "$U" ] || continue
            if ssh $SSHO -o BatchMode=yes "$U@$H" true 2>/dev/null; then
              UTIL="$U"
              break
            fi
            echo "-- $U : refuse"
          done
          if [ -z "$UTIL" ]; then
            R="infra/vm-run/resultats/$N.txt"
            {
              echo "AUCUN compte n'accepte la cle du pont sur $H (sshd repond : la VM est vivante)."
              echo "Candidats essayes : ${VM_USER:-<non defini>} opc ocarun ubuntu"
              echo ""
              echo "===== LA CLE DU SECRET VM_SSH_KEY ====="
              echo "premiere ligne : $(head -1 ~/.ssh/id_vm)"
              echo "lignes         : $(wc -l < ~/.ssh/id_vm) | octets : $(wc -c < ~/.ssh/id_vm)"
              echo "-- type / taille / empreinte (ssh-keygen) --"
              ssh-keygen -l -f ~/.ssh/id_vm 2>&1 || echo "ILLISIBLE : ce n'est pas une cle privee OpenSSH valide"
            } > "$R"
            # La cle PUBLIQUE derivee : ce n'est pas un secret, et c'est exactement la ligne
            # a installer dans authorized_keys. Sans elle on devine ; avec elle on sait.
            if ssh-keygen -y -f ~/.ssh/id_vm > /tmp/pub.txt 2>/tmp/puberr.txt; then
              {
                echo ""
                echo "===== CLE PUBLIQUE CORRESPONDANTE (a installer telle quelle) ====="
                cat /tmp/pub.txt
              } >> "$R"
            else
              {
                echo ""
                echo "===== IMPOSSIBLE DE DERIVER LA CLE PUBLIQUE ====="
                echo "Motif : $(head -2 /tmp/puberr.txt | tr '\n' ' ')"
                echo "(cle protegee par passphrase, format PuTTY .ppk, ou collage incomplet)"
              } >> "$R"
            fi
            {
              echo ""
              echo "===== CE QUE DIT SSHD (dialogue verbeux, compte opc) ====="
              ssh -v $SSHO -o BatchMode=yes "opc@$H" true 2>&1 \
                | grep -aE "Offering|Authentications that can continue|Server accepts key|denied|no mutual|banner|Connect|Trying private" \
                | head -12
              echo ""
              echo "== fin : rc=255 $(date -u +%FT%TZ) hote=$H utilisateur=aucun =="
            } >> "$R"
            RC=255
          else
            echo "== $N -> $UTIL@$H =="
            set +e
            timeout 4800 ssh $SSHO -o ServerAliveInterval=30 -o ServerAliveCountMax=8 \
              "$UTIL@$H" 'bash -s' < "$CMD" > "infra/vm-run/resultats/$N.txt" 2>&1
            RC=$?
            set -e
            {
              echo ""
              echo "== fin : rc=$RC $(date -u +%FT%TZ) hote=$H utilisateur=$UTIL =="
            } >> "infra/vm-run/resultats/$N.txt"
          fi
          tail -40 "infra/vm-run/resultats/$N.txt"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add "infra/vm-run/resultats/$N.txt"
          git commit -m "chore(vm-run): resultat $N (rc=$RC)" -m "Sortie complete de la commande, executee par le pont vm-run (SSH via secret du depot)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:claude/oracle-free-tier-access-IN1Wm
