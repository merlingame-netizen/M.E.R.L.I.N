# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v46_geste_dit_et_de_dispense.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/game/merlin_resolution.gd scripts/game/merlin_fx.gd scripts/game/merlin_game.gd tools/probe_partie_journal.gd
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "feat(jeu): v46 - le geste se dit, et le de se dispense" -m "Maxime : OBSERVER + Le Pressentiment rendu par des mains poussant une pierre de basalte. v45 avait donne une regle au modele ; v46 lui RETIRE la charge. La phrase du geste est composee par le CODE (socle du verbe + maniere du trait, 25 concepts couverts, deterministe) et s ecrit a la machine entre la fusion et le de - le modele n ecrit plus que la SUITE. Les ~2 s de frappe sont donnees a l ecriture de l issue qui court deja en fond : l animation paie le LLM au lieu de l attendre." -m "Et le de se dispense : la maitrise du verbe (talent >= 2) et la rarete du trait (Rare/Epique/Mythique) achetent de la marge sur le jet MINIMAL - un sceau s appose, la mise annonce pourquoi. Jamais au Climax (l eclat n existe que par le risque). A talent 0 + trait Commune la marge vaut 0 : comportement v34 strictement inchange. La ligne mecanique cesse d annoncer un 2d6 qui n a pas roule (mensonge latent depuis v34)." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
