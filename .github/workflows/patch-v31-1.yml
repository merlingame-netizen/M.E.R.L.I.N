# Patcheur du jeu — remplacements exacts + VALIDATION GODOT + commit + push sur feat/practices-docs.
#
# La validation vit dans le patcheur : parse check editeur puis sonde du geste, sur Godot 4.4.1
# (parite VM/box — 4.5-stable a pendu 2 h 27 sur ce depot), et REFUS de pousser si l'un des deux
# echoue. Un patch casse ne peut plus atteindre la branche du jeu.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
# Deux pushes rapproches = deux runs sur la meme cible : l'ancien n'a plus de valeur, il est
# annule (c'est aussi ce qui aurait coupe le run 4.5 pendu, que le token ne pouvait annuler).
concurrency:
  group: patch-v31-1
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    # Sans borne, un editeur qui pend mange six heures de minutes Actions (vecu).
    timeout-minutes: 50
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: |
          # Un patch DEJA applique sur la branche du jeu n'est pas une panne : c'est ce qui
          # arrive des qu'on pousse un NOUVEAU fichier dans infra/patches/ pendant que le
          # pointeur designe encore le precedent. On distingue les deux cas : motif absent =
          # deja applique, on ne pousse rien ; toute autre erreur reste un refus.
          set -o pipefail
          echec=0
          for patch in v49_1_instantane_a_temps v49_2_un_bon_fil_ou_rien; do
            if python3 "outillage/infra/patches/$patch.py" 2>&1 | tee /tmp/patch.log; then
              echo "$patch : applique"
            elif grep -q "motif trouve 0 fois" /tmp/patch.log; then
              echo "::notice::$patch DEJA applique — rien a faire"
            else
              echo "::error::$patch a echoue pour une autre raison que « deja applique »"
              echec=1
            fi
          done
          [ "$echec" -eq 0 ] || exit 1
      - name: Godot en cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.4.1-stable-linux-x86_64
      - name: Godot (telechargement si cache froid)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Validation 1 — parse check editeur
        run: |
          ~/godot-bin/godot --version
          timeout 600 ~/godot-bin/godot --headless --editor --quit --path . 2>&1 | tee /tmp/parse.log || true
          # Bruit tolere (absent du runner, sans rapport avec le patch) : gdextension ARM,
          # traductions non importees, police VT323. Toute erreur de SCRIPT est un refus.
          if grep -aE "SCRIPT ERROR|Compile Error" /tmp/parse.log; then
            echo "::error::le patch introduit des erreurs de script — rien n'est pousse"
            exit 1
          fi
          # Un log de parse VIDE (timeout sans une ligne utile) n'est pas un succes.
          if [ ! -s /tmp/parse.log ]; then
            echo "::error::parse check muet — rien n'est pousse"
            exit 1
          fi
      - name: Validation 2 — sonde du geste (l'animation tourne vraiment)
        run: |
          timeout 900 ~/godot-bin/godot --headless --path . res://tools/probe_fx_geste.tscn 2>&1 | tee /tmp/sonde.log || true
          grep -a "SONDE GESTE\|fantome\|ratio max" /tmp/sonde.log || true
          grep -aq "SONDE GESTE : OK" /tmp/sonde.log || {
            echo "::error::la sonde du geste n'a pas rendu OK — rien n'est pousse"
            exit 1
          }
      # Validation 3 — LES SCRIPTS DE tools/ TOUCHES PAR LE PATCH SONT VRAIMENT PARSES.
      #
      # Trou constate au run #37 (v48.1a) : la validation 1 (--editor --quit) a rendu en 10 s et
      # la validation 2 charge une scene qui n'inclut aucun script de tools/. Le patch touchait
      # probe_partie_journal.gd -- aucune des deux ne l'a donc lu. Pire, un Godot qui plante
      # pendant l'import laisse un log non vide sans « SCRIPT ERROR » : la validation 1 passe.
      #
      # On ne controle QUE les fichiers que le patch vient de modifier. Un balayage de tout
      # tools/ echouerait a tort : probe_fx_geste.gd reference l'autoload MerlinAudio, absent en
      # mode --check-only --script, alors qu'il tourne parfaitement comme scene (c'est la
      # validation 2). Seuls les scripts strictement duck-types passent ce mode -- ce qui est
      # justement la regle du dossier tools/.
      - name: Validation 3 — parse de TOUS les scripts touches par le patch
        run: |
          TOUCHES="$(git diff --name-only -- '*.gd')"
          [ -n "$TOUCHES" ] || { echo "aucun script .gd touche — rien a controler"; exit 0; }
          echec=0
          for f in $TOUCHES; do
            timeout 300 ~/godot-bin/godot --headless --path . --check-only \
              --script "res://$f" > /tmp/chk.log 2>&1 || true
            if grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" /tmp/chk.log | grep -av "\.tres" | grep -aq .; then
              echo "::error::$f ne parse pas"
              grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" /tmp/chk.log | grep -av "\.tres" | head -5
              echec=1
            else
              echo "ok $f"
            fi
          done
          [ "$echec" -eq 0 ] || { echo "::error::un script touche ne parse pas — rien n'est pousse"; exit 1; }
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_scenario.gd tools/probe_partie_journal.gd
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "feat(jeu): v49.1+2 - la mesure prise a temps, et un bon fil ou pas de fil" -m "v49.1 — POURQUOI dc, total, marge, geste_sur et phrase_geste sont ENCORE vides dans le journal. v48.1a placait l instantane de _pending_res APRES la branche du typewriter dans la boucle de la sonde ; or cette branche appelle _skip_typewriter() puis un continue, et le skip declenche _on_typewriter_done qui vide _pending_res. L instantane n etait donc jamais atteint tant que la variable avait quelque chose dedans. Il remonte tout en haut du corps de la boucle, avant la moindre branche qui sort. Sans lui, une partie temoin ANNONCE ses reussites sans pouvoir les PROUVER." -m "v49.2 — v49 a fait passer la continuite de 0 a 5 sur 5 : chaque scene s ouvre desormais sur ce que l issue precedente a laisse. Mais p73 montre que le compteur ne dit pas tout, et trois defauts sautent aux yeux dans le texte. Des SCORIES : deux fils sur cinq commencent par une asterisque, que le modele seme et que le fil transporte en tete de la scene suivante. La PHRASE DU GESTE prise pour un crochet : le beat 2 s ouvrait sur Vous plantez vos appuis dans la terre molle — la premiere phrase de l issue, celle du geste, qui raconte ce que le Voyageur vient de faire et non ce qui l attend. Et le FIL QUI PARLE DU VOYAGEUR au lieu du monde : Vous sentez l humidite sur vos vetements ouvrait le Climax." -m "Trois regles de plus, gouvernees par un principe : mieux vaut PAS DE FIL qu un mauvais fil. Un refus rend simplement le pont mecanique d avant, qui n a jamais rien casse. Mesure sur les cinq enchainements reels de p73 : la regle actuelle rend 5 fils dont 3 fautifs, la regle stricte en rend 4 tous propres, et le cinquieme retombe sur le pont. Le beat 6 s ouvrirait sur Le sentier etroit sous la voute s impose comme seul passage." -m "Parse check Godot 4.4.1 passe en local sur les deux fichiers." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
