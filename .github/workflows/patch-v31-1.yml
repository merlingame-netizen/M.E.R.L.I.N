# Patcheur du jeu — la session distante a perdu git local : les correctifs du jeu
# passent par ce workflow (remplacements exacts/spans + commit + push sur feat/practices-docs).
# Déclenché par un push touchant infra/patches/** ; il exécute le script de patch COURANT.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v34_1_frequence_pactes.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/game/merlin_run.gd tools/probe_partie_journal.gd
          git commit -m "feat(jeu): v34.1 - cap de frequence des pactes (2/quete) + sonde acheteuse" -m "Journal v34 : 16/18 points de corruption venaient des pactes, un par beat - le prix etait cape (+3), pas le rythme. can_convert exige desormais conversions_this_quest < 2 (l'esprit de la decision : une pente gerable, le compteur repart a chaque quete). Sonde : seuils d'achat 8 PV / 8 corruption pour exercer l'etal." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
