# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v46_2_sonde_complete.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add tools/probe_fx_geste.gd tools/probe_fx_geste.tscn
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "test(jeu): v46.2 - la sonde couvre tout ce que v46 a touche" -m "Restaient deux surfaces livrees sans avoir jamais tourne. LA LIGNE MECANIQUE : du texte LU par le joueur — un geste sans de ne doit plus annoncer 2d6 7, la face de repli (mensonge latent depuis v34, rendu frequent par la dispense). LE MOUVEMENT REDUIT : la phrase doit etre pleine d emblee, sans frappe." -m "Contre-epreuve faite sur chacune : ligne remise en 2d6 sur un geste sur -> rc=1 avec le motif exact ; mouvement reduit neutralise -> rc=1, ratio min 0.00. Piege note dans le code apres s y etre fait prendre : en GDScript une lambda capture les locales par VALEUR, un compteur ferme ne remonte jamais et la sonde se ment alors a elle-meme." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
