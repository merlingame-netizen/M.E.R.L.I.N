# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v43_carnet_du_voyageur.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/game/merlin_chronicle.gd scripts/game/merlin_game.gd scripts/llm/merlin_prompt_builder.gd scripts/llm/merlin_scenario.gd
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "feat(jeu): v43 - le carnet du Voyageur, et le re-essai qui ne jette plus rien" -m "Le Voyageur SE SOUVIENT (decision Maxime) mais uniquement de ce qui est ecrit : MerlinChronicle garde les trois dernieres traversees (titre, fin, integrite, corruption, PNJ croises, faits marquants), merlin_game ecrit la page a la fin de chaque partie, et bloc_carnet() remplace la regle 'aucun passe' dans la selection et l'intro - carnet vide = premiere venue. L'issue garde une ligne breve (contexte 2048, lecon v42.1). Et le re-essai ne jette plus sa premiere version : une prose valide part en reserve et ressort si la seconde ecriture echoue." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
