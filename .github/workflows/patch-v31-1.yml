# Patcheur du jeu — remplacements exacts + VALIDATION GODOT + commit + push sur feat/practices-docs.
#
# La validation vit dans le patcheur : parse check editeur puis sonde du geste, sur Godot 4.4.1
# (parite VM/box — 4.5-stable a pendu 2 h 27 sur ce depot), et REFUS de pousser si l'un des deux
# echoue. Un patch casse ne peut plus atteindre la branche du jeu.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
# Deux pushes rapproches = deux runs sur la meme cible : l'ancien n'a plus de valeur, il est
# annule (c'est aussi ce qui aurait coupe le run 4.5 pendu, que le token ne pouvait annuler).
concurrency:
  group: patch-v31-1
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    # Sans borne, un editeur qui pend mange six heures de minutes Actions (vecu).
    timeout-minutes: 50
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: |
          python3 outillage/infra/patches/v48_1f_la_boucle_se_dit.py
          python3 outillage/infra/patches/v48_1g_plein_regime_et_falaise.py
      - name: Godot en cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.4.1-stable-linux-x86_64
      - name: Godot (telechargement si cache froid)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Validation 1 — parse check editeur
        run: |
          ~/godot-bin/godot --version
          timeout 600 ~/godot-bin/godot --headless --editor --quit --path . 2>&1 | tee /tmp/parse.log || true
          # Bruit tolere (absent du runner, sans rapport avec le patch) : gdextension ARM,
          # traductions non importees, police VT323. Toute erreur de SCRIPT est un refus.
          if grep -aE "SCRIPT ERROR|Compile Error" /tmp/parse.log; then
            echo "::error::le patch introduit des erreurs de script — rien n'est pousse"
            exit 1
          fi
          # Un log de parse VIDE (timeout sans une ligne utile) n'est pas un succes.
          if [ ! -s /tmp/parse.log ]; then
            echo "::error::parse check muet — rien n'est pousse"
            exit 1
          fi
      - name: Validation 2 — sonde du geste (l'animation tourne vraiment)
        run: |
          timeout 900 ~/godot-bin/godot --headless --path . res://tools/probe_fx_geste.tscn 2>&1 | tee /tmp/sonde.log || true
          grep -a "SONDE GESTE\|fantome\|ratio max" /tmp/sonde.log || true
          grep -aq "SONDE GESTE : OK" /tmp/sonde.log || {
            echo "::error::la sonde du geste n'a pas rendu OK — rien n'est pousse"
            exit 1
          }
      # Validation 3 — LES SCRIPTS DE tools/ TOUCHES PAR LE PATCH SONT VRAIMENT PARSES.
      #
      # Trou constate au run #37 (v48.1a) : la validation 1 (--editor --quit) a rendu en 10 s et
      # la validation 2 charge une scene qui n'inclut aucun script de tools/. Le patch touchait
      # probe_partie_journal.gd -- aucune des deux ne l'a donc lu. Pire, un Godot qui plante
      # pendant l'import laisse un log non vide sans « SCRIPT ERROR » : la validation 1 passe.
      #
      # On ne controle QUE les fichiers que le patch vient de modifier. Un balayage de tout
      # tools/ echouerait a tort : probe_fx_geste.gd reference l'autoload MerlinAudio, absent en
      # mode --check-only --script, alors qu'il tourne parfaitement comme scene (c'est la
      # validation 2). Seuls les scripts strictement duck-types passent ce mode -- ce qui est
      # justement la regle du dossier tools/.
      - name: Validation 3 — parse de TOUS les scripts touches par le patch
        run: |
          TOUCHES="$(git diff --name-only -- '*.gd')"
          [ -n "$TOUCHES" ] || { echo "aucun script .gd touche — rien a controler"; exit 0; }
          echec=0
          for f in $TOUCHES; do
            timeout 300 ~/godot-bin/godot --headless --path . --check-only \
              --script "res://$f" > /tmp/chk.log 2>&1 || true
            if grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" /tmp/chk.log | grep -av "\.tres" | grep -aq .; then
              echo "::error::$f ne parse pas"
              grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" /tmp/chk.log | grep -av "\.tres" | head -5
              echec=1
            else
              echo "ok $f"
            fi
          done
          [ "$echec" -eq 0 ] || { echo "::error::un script touche ne parse pas — rien n'est pousse"; exit 1; }
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_prompt_builder.gd scripts/llm/merlin_native.gd
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "feat(jeu): v48.1f+g - la boucle se dit, et l issue ecrit a plein regime" -m "v48.1f - LA LOI DE LA BOUCLE. v48 a grave dans le canon la signature du monde : Broceliande BOUCLE sur elle-meme, les etres REJOUENT sans fin la meme scene, seul le Voyageur avance. Deux parties temoins l ont mesure et la reponse est la meme : boucle=0. Zero occurrence dans toute la prose de p68 comme de p69. Les lieux passent, les figures passent, les interdits tiennent a 3/3 — la boucle jamais. Elle etait ecrite comme du CONTEXTE, pas comme une CONSIGNE : un modele fait ce qu on lui demande de faire, il ne fait pas ce qu on lui raconte du decor. Elle devient donc une phrase imperative et courte dans les TROIS generateurs de scene (scene_jit, arc_tranche, arc en 5 etapes), qui demande de la MONTRER par un detail concret — un etre qui refait un geste deja fait, une trace qui revient, une parole redite — et jamais de l expliquer. En tete stable, donc amortie par le cache des la deuxieme scene. L issue n est pas touchee : le decor appartient au Conteur." -m "v48.1g - LE PLEIN REGIME, le levier direct sur la cible des 20 secondes. L issue est la SEULE generation de la chaine chaude a ne pas le demander : la selection le pose, scene_jit le pose, l amorcage le pose, elle non. Sans lui _apply_regime sert _fils_menage() = la moitie des coeurs (merlin_native.gd:468-482), soit 2 fils sur 4. Les 8,4-8,7 tok/s mesures a p68 sont donc un debit a DEMI-REGIME et le debit plein du Vif n a jamais ete mesure. Or l issue est exactement le cas pour lequel le plein regime a ete ecrit : la generation que le joueur attend le plus activement. L evaluation du prompt ne bouge pas, seule l ecriture accelere. RISQUE nomme : l issue se streame sous les yeux du joueur et le rendu est logiciel — lui prendre deux coeurs peut faire saccader l affichage. La partie temoin prend des captures, on regardera ; ce patch se retire en un mot si le rendu souffre." -m "v48.1g - LA FALAISE. Au-dela de n_ctx-4 = 2044 tokens le natif tronque le prompt PAR L AVANT (merlin_llm.cpp:243-249) : il jette le gabarit, la consigne systeme et le haut des regles, ET desactive la reutilisation du prefixe KV (:271). v48.1b a rendu ~450 tokens, ce qui eloigne la falaise sans la supprimer : la narration injectee en queue variait de 239 a 694 caracteres et rien ne la bornait. Elle est desormais bornee a 480, en gardant la FIN — la ou vivent l instant suspendu et les etres nommes que l issue doit faire reagir — et repartant d une frontiere de phrase." -m "v48.1g - LA TAILLE DU PROMPT. prompt_tokens est le DELTA decode, remis a zero a chaque generation : 2 quand le cache a tout servi, 2045 quand tout a ete relu. Il ne dit rien de la longueur du prompt, donc rien de la place restante. prompt_chars entre dans les metriques : sans lui aucun ratio caracteres/token n est etablissable sur cette machine (ni tokenizer Gemma, ni source llama.cpp) et tout calcul de budget reste une estimation." -m "Issu de l autopsie adversariale a 17 agents. Parse check Godot 4.4.1 passe en local sur les deux fichiers." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
