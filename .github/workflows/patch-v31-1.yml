# Patcheur du jeu — la session distante a perdu git local : les correctifs du jeu
# passent par ce workflow (remplacements exacts/spans + commit + push sur feat/practices-docs).
# Déclenché par un push touchant infra/patches/** ; il exécute le script de patch COURANT.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v34_dealer_sceau_etal.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_prompt_builder.gd scripts/llm/merlin_scenario.gd scripts/game/merlin_resolution.gd scripts/game/merlin_fx.gd scripts/game/merlin_dice.gd scripts/game/merlin_run.gd scripts/game/merlin_game.gd tools/probe_partie_journal.gd
          git commit -m "feat(jeu): v34 - ton du dealer, sceau du geste sur, etal 40 %, pactes cap +3/quete" -m "Style direct HoF2 : issues 3-5 phrases declaratives (une image au plus, pas de lyrisme), budgets resserres, scenes/arc/ouverture au meme ton. Geste sur : quand couverture+synergie garantissent la reussite au jet minimal, aucun de - un sceau runique s appose (l eclatante reste reservee aux vrais jets) ; des a pips graves. Pactes : prix min(compteur de quete+1, 3), reset a chaque quete. Etal du colporteur : tirage deterministe ~40 %/quete (titre+index), prioritaire sur l offrande a la premiere Rencontre de la quete, garantie historique conservee en filet. Sonde : t_pres/t_res/duree par beat, metrics de generation, geste_sur/total/dc, politique d achat a l etal et journal des etals. Decisions Maxime 2026-08-19 soir." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
