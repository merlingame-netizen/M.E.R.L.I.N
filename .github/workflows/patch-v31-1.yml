# Patcheur v31.1 — la session distante a perdu git local : les correctifs du jeu
# passent par ce workflow (remplacements exacts + commit + push sur feat/practices-docs).
# Déclenché à la main (workflow_dispatch) depuis l'API.
name: patch-v31-1
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v31_1_priorite_du_fil.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_native.gd scripts/llm/merlin_scenario.gd
          git commit -m "feat(llm): v31.1 - priorite du fil (issue > lookahead > arc) + amorcage Vif sous le voile" -m "Validation 6 beats du 2026-08-19 : beats 1-2 seuls au secours (l'amorcage de la tete d'issue ne trouvait jamais de place avant la premiere pose) et 0 lookahead servie (l'arc occupait le moteur en continu, le prefetch cedait en silence). L'ouverture amorce desormais la tete du Vif sous le voile ; le prefetch de scene attend une issue mais preempte une tranche d'arc, et cette cession n'est pas comptee comme echec reel." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
