# Patcheur du jeu — la session distante a perdu git local : les correctifs du jeu
# passent par ce workflow (remplacements exacts/spans + commit + push sur feat/practices-docs).
# Déclenché par un push touchant infra/patches/** ; il exécute le script de patch COURANT.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v34_2_grace_stream.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/game/merlin_game.gd
          git commit -m "fix(jeu): v34.2 - grace de demarrage du stream d'issue" -m "L'unique banc de la demo 10 beats (beat 3, 30 s) : _stream_resolution testait is_resolution_incoming pendant le drain du prefetch relance et concluait a tort a la mort de la generation. Grace de 8 s avant cette sortie." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
