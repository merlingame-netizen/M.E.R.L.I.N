# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v36_issue_directe.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_prompt_builder.gd
          git commit -m "feat(jeu): v36 - l'issue directe : 2-3 phrases, verbe joue, zero image" -m "Retour Maxime sur p50 : trop de texte, trop image, actions incoherentes avec le geste choisi, trop long a generer. Racine de l'incoherence : le VERBE de la tuile jouee (played_cards[0], contrat R20) n'entrait jamais dans le prompt d'issue - COMBATTRE donnait un fer plante en terre, PARLER une voix sans parole. v36 : verbe transmis + regle dure par verbe dans la tete stable, 2-3 phrases seches (budgets 140/105, r1 160/115), zero image/metaphore/comparaison partout (issues, scene lookahead, arc), Climax compris." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
