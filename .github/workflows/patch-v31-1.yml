# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v40_voyageur_pnj_economie.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/game/merlin_game.gd scripts/llm/merlin_scenario.gd scripts/llm/merlin_prompt_builder.gd tools/probe_partie_journal.gd
          git commit -m "feat(jeu): v40 - ecriture au Voyageur, colporteur narre, economie visible" -m "Retour Maxime : ecriture encore suggestive, PNJ de la bible absents du recit, compteur de monnaie invisible. Garde cote code : premiere phrase d'issue sans 'Vous' => UN re-essai (contrat v35.5) ; sujets abstraits bannis du prompt ; le colporteur ARRIVE dans le recit (banc de 3 arrivees, pattern R128) avant son etal ; bourse toujours visible (meme a 0) avec butin annonce '(+X)' ; gwenneg par beat dans le journal de sonde." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
