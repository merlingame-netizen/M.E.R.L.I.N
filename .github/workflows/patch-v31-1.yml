# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v44_drain_du_pacte.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_scenario.gd
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "fix(jeu): v44 - le banc du pacte : l'annulation n'avait que 4 s pour prendre" -m "Autopsie : aucun moteur muet (vides=0). Le log dit 'cache VIDE pour ...::reussite (etat=running, vol pour ...::partiel)' - le pacte accepte change la couverture, donc le degre, donc la signature de l'issue. La relance doit annuler la generation en vol, mais une annulation ne prend qu'entre deux tokens : en pleine evaluation de prompt (976 tok, 94 s), la voie reste occupee au-dela des 4 s du drain, qui expire, et plus rien n'est relance. Trois parties, trois bancs, toujours au beat du pacte. Drain porte a 20 s." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
