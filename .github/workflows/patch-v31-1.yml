# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v42_canon_et_passe.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_prompt_builder.gd
          git commit -m "feat(jeu): v42 - le Voyageur n'a pas de passe invente, le canon borne le monde" -m "Les pitchs de selection et l'intro pretaient au Voyageur une faute ancienne, un retour, des voyages - alors que rien n'est ecrit nulle part et que MerlinChronicle ne nourrit que le menu. REGLE_PASSE (aucun passe tant que rien n'est au carnet ; aucun personnage ne le reconnait ; tout nait ici) et LORE_CANON (le lieu, les figures nommees du roster bible §6, et ce qui n'existe pas) poses en tete stable des issues et des scenes, et en tete des prompts de selection et d'intro. Une quete ne repare plus jamais une faute du Voyageur." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
