# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v37_priorite_scene.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_scenario.gd scripts/llm/merlin_prompt_builder.gd
          git commit -m "feat(jeu): v37 - priorite scene bornee (20 s) + scene 65 tokens" -m "p51 : 4 scenes generees, 4 jetees trop tard (45-90 s) pour des fenetres de ~40-55 s - la fenetre s'est refermee (v36 : beats 29-46 s) et le plein regime ne s'enclenche jamais (la pose relance l'issue pendant la lecture, le Vif n'est presque jamais libre : scenes a 1,7-2,5 tok/s en duo permanent). v37 : au prefetch d'issue, si une scene lookahead ecrit, l'issue attend (borne 20 s) - seule, la scene tourne a plein regime (~25-30 s) ; scene 1-2 phrases, 65 tokens." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
