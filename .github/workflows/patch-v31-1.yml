# Patcheur du jeu — remplacements exacts + VALIDATION GODOT + commit + push sur feat/practices-docs.
#
# La validation vit dans le patcheur : parse check editeur puis sonde du geste, sur Godot 4.4.1
# (parite VM/box — 4.5-stable a pendu 2 h 27 sur ce depot), et REFUS de pousser si l'un des deux
# echoue. Un patch casse ne peut plus atteindre la branche du jeu.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
# Deux pushes rapproches = deux runs sur la meme cible : l'ancien n'a plus de valeur, il est
# annule (c'est aussi ce qui aurait coupe le run 4.5 pendu, que le token ne pouvait annuler).
concurrency:
  group: patch-v31-1
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    # Sans borne, un editeur qui pend mange six heures de minutes Actions (vecu).
    timeout-minutes: 50
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v48_1b_rendre_la_place.py
      - name: Godot en cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.4.1-stable-linux-x86_64
      - name: Godot (telechargement si cache froid)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Validation 1 — parse check editeur
        run: |
          ~/godot-bin/godot --version
          timeout 1800 ~/godot-bin/godot --headless --editor --quit --path . 2>&1 | tee /tmp/parse.log || true
          # Bruit tolere (absent du runner, sans rapport avec le patch) : gdextension ARM,
          # traductions non importees, police VT323. Toute erreur de SCRIPT est un refus.
          if grep -aE "SCRIPT ERROR|Compile Error" /tmp/parse.log; then
            echo "::error::le patch introduit des erreurs de script — rien n'est pousse"
            exit 1
          fi
          # Un log de parse VIDE (timeout sans une ligne utile) n'est pas un succes.
          if [ ! -s /tmp/parse.log ]; then
            echo "::error::parse check muet — rien n'est pousse"
            exit 1
          fi
      - name: Validation 2 — sonde du geste (l'animation tourne vraiment)
        run: |
          timeout 900 ~/godot-bin/godot --headless --path . res://tools/probe_fx_geste.tscn 2>&1 | tee /tmp/sonde.log || true
          grep -a "SONDE GESTE\|fantome\|ratio max" /tmp/sonde.log || true
          grep -aq "SONDE GESTE : OK" /tmp/sonde.log || {
            echo "::error::la sonde du geste n'a pas rendu OK — rien n'est pousse"
            exit 1
          }
      # Validation 3 — LES SCRIPTS DE tools/ TOUCHES PAR LE PATCH SONT VRAIMENT PARSES.
      #
      # Trou constate au run #37 (v48.1a) : la validation 1 (--editor --quit) a rendu en 10 s et
      # la validation 2 charge une scene qui n'inclut aucun script de tools/. Le patch touchait
      # probe_partie_journal.gd -- aucune des deux ne l'a donc lu. Pire, un Godot qui plante
      # pendant l'import laisse un log non vide sans « SCRIPT ERROR » : la validation 1 passe.
      #
      # On ne controle QUE les fichiers que le patch vient de modifier. Un balayage de tout
      # tools/ echouerait a tort : probe_fx_geste.gd reference l'autoload MerlinAudio, absent en
      # mode --check-only --script, alors qu'il tourne parfaitement comme scene (c'est la
      # validation 2). Seuls les scripts strictement duck-types passent ce mode -- ce qui est
      # justement la regle du dossier tools/.
      - name: Validation 3 — parse des scripts de tools/ touches par le patch
        run: |
          TOUCHES="$(git diff --name-only -- 'tools/*.gd')"
          [ -n "$TOUCHES" ] || { echo "aucun script de tools/ touche — rien a controler"; exit 0; }
          echec=0
          for f in $TOUCHES; do
            timeout 300 ~/godot-bin/godot --headless --path . --check-only \
              --script "res://$f" > /tmp/chk.log 2>&1 || true
            if grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" /tmp/chk.log | grep -av "\.tres" | grep -aq .; then
              echo "::error::$f ne parse pas"
              grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" /tmp/chk.log | grep -av "\.tres" | head -5
              echec=1
            else
              echo "ok $f"
            fi
          done
          [ "$echec" -eq 0 ] || { echo "::error::un script de tools/ ne parse pas — rien n'est pousse"; exit 1; }
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_prompt_builder.gd
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "feat(jeu): v48.1b - rendre la place d ecrire" -m "LE FAIT, mesure au journal de p68 et confirme dans le C++ : le nombre de tokens ecrits vaut EXACTEMENT n_ctx moins la longueur du prompt. Beat 1 : prompt 1964, 84 ecrits ; beat 2 : 2033, 15 ; beat 5 : 2022, 26 ; beats 3 et 4 : 2045, 2 ecrits -- « Vous calez », le mur, puis le secours. n_past demarre a la longueur TOTALE du prompt (merlin_llm.cpp:408), que le prefixe KV soit reutilise ou non, et la boucle s arrete a n_ctx - 1 (merlin_llm.cpp:414) : max_tokens ne veut plus rien dire, le budget d ecriture est ce qui RESTE du contexte. Au-dela de 2044 tokens le prompt est en plus tronque, ce qui DESACTIVE la reutilisation du prefixe -- d ou les 40 a 57 s passees a relire un prompt qui ne laissera rien ecrire." -m "Ce plafond est ANTERIEUR a v48 : LORE_CANON ne figure pas dans le prompt d issue, il ne sert qu au Conteur. Le poids est le prefixe fixe de l issue, ~1573 tokens soit 77 pour cent du contexte, dont le seul bloc de regles ~1005. Rien ne l avait revele parce qu aucune partie complete n avait tourne du 24 au 27 aout." -m "Le remede applique a l ECRITURE la doctrine deja actee pour l affichage en v46 : ce qui doit etre vrai a 100 pour cent ne se demande pas a un LLM. Le code compose deja la phrase du geste (phrase_du_geste : socle du verbe + maniere du trait, 25 concepts) ; elle ne servait qu a l ecran. On la donne desormais au modele en QUEUE de prompt comme ancrage de sa premiere phrase, et les quatre segments de regles qui cherchaient le meme invariant par la persuasion -- sens des cinq registres, gloses des cinq verbes, maniere du trait, interdit des gestes inventes, ~425 tokens -- disparaissent. Trois autres segments sont resserres sans perdre leur contrainte, et une reference devenue orpheline est nommee." -m "MESURE APRES PATCH : bloc de regles 3315 -> 1870 caracteres (~1005 -> ~566 tokens) ; prefixe fixe 5193 -> 3748 (~1573 -> ~1135) ; place d ecriture 2-84 -> ~412 tokens. max_tokens (125-160) redevient le vrai plafond. Le prefixe reste stable d un beat a l autre, donc le cache KV saute son evaluation des le 2e beat." -m "Ni le canon, ni le Conteur, ni l equilibrage, ni une seule regle du jeu ne sont touches. Le modele ecrit toujours sa premiere phrase lui-meme : on lui donne le geste a accomplir, pas la phrase a recopier. Un repli sur le verbe seul couvre les appelants sans phrase composee." -m "Patch applique par le workflow patch-v31-1, apres parse check editeur, sonde du geste et parse des scripts touches." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
