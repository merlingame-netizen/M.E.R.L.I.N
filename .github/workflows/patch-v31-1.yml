# Patcheur du jeu — remplacements exacts + commit + push sur feat/practices-docs.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v39_arc_cede_aux_issues.py
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_scenario.gd
          git commit -m "feat(jeu): v39 - l'arc s'efface devant toute issue en vol" -m "p56 : issue du beat 1 a 2,7 tok/s pendant que l'arc ecrit ses tranches (peage 73-148 s), 8-9 tok/s seule des le beat 2. La regle de repatience de l'arc (scene lookahead, voie occupee) s'etend aux issues : le joueur les attend, pas l'arc. L'arc rattrape pendant les lectures ; budget d'horloge et renoncements nommes inchanges." -m "Patch applique par le workflow patch-v31-1 (canal Actions)." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
