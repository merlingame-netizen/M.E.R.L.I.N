# Patcheur du jeu — remplacements exacts + VALIDATION GODOT + commit + push sur feat/practices-docs.
#
# La validation vit dans le patcheur : parse check editeur puis sonde du geste, sur Godot 4.4.1
# (parite VM/box — 4.5-stable a pendu 2 h 27 sur ce depot), et REFUS de pousser si l'un des deux
# echoue. Un patch casse ne peut plus atteindre la branche du jeu.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
# Deux pushes rapproches = deux runs sur la meme cible : l'ancien n'a plus de valeur, il est
# annule (c'est aussi ce qui aurait coupe le run 4.5 pendu, que le token ne pouvait annuler).
concurrency:
  group: patch-v31-1
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    # Sans borne, un editeur qui pend mange six heures de minutes Actions (vecu).
    timeout-minutes: 50
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: |
          # Un patch DEJA applique sur la branche du jeu n'est pas une panne : c'est ce qui
          # arrive des qu'on pousse un NOUVEAU fichier dans infra/patches/ pendant que le
          # pointeur designe encore le precedent. On distingue les deux cas : motif absent =
          # deja applique, on ne pousse rien ; toute autre erreur reste un refus.
          set -o pipefail
          echec=0
          for patch in v52_le_lore_entre_dans_la_chaine_chaude v53_une_seule_avance_par_beat; do
            if python3 "outillage/infra/patches/$patch.py" 2>&1 | tee /tmp/patch.log; then
              echo "$patch : applique"
            elif grep -q "motif trouve 0 fois" /tmp/patch.log; then
              echo "::notice::$patch DEJA applique — rien a faire"
            else
              echo "::error::$patch a echoue pour une autre raison que « deja applique »"
              echec=1
            fi
          done
          [ "$echec" -eq 0 ] || exit 1
      - name: Godot en cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.4.1-stable-linux-x86_64
      - name: Godot (telechargement si cache froid)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Validation 1 — parse check editeur
        run: |
          ~/godot-bin/godot --version
          timeout 600 ~/godot-bin/godot --headless --editor --quit --path . 2>&1 | tee /tmp/parse.log || true
          # Bruit tolere (absent du runner, sans rapport avec le patch) : gdextension ARM,
          # traductions non importees, police VT323. Toute erreur de SCRIPT est un refus.
          if grep -aE "SCRIPT ERROR|Compile Error" /tmp/parse.log; then
            echo "::error::le patch introduit des erreurs de script — rien n'est pousse"
            exit 1
          fi
          # Un log de parse VIDE (timeout sans une ligne utile) n'est pas un succes.
          if [ ! -s /tmp/parse.log ]; then
            echo "::error::parse check muet — rien n'est pousse"
            exit 1
          fi
      - name: Validation 2 — sonde du geste (l'animation tourne vraiment)
        run: |
          timeout 900 ~/godot-bin/godot --headless --path . res://tools/probe_fx_geste.tscn 2>&1 | tee /tmp/sonde.log || true
          grep -a "SONDE GESTE\|fantome\|ratio max" /tmp/sonde.log || true
          grep -aq "SONDE GESTE : OK" /tmp/sonde.log || {
            echo "::error::la sonde du geste n'a pas rendu OK — rien n'est pousse"
            exit 1
          }
      # Validation 3 — LES SCRIPTS DE tools/ TOUCHES PAR LE PATCH SONT VRAIMENT PARSES.
      #
      # Trou constate au run #37 (v48.1a) : la validation 1 (--editor --quit) a rendu en 10 s et
      # la validation 2 charge une scene qui n'inclut aucun script de tools/. Le patch touchait
      # probe_partie_journal.gd -- aucune des deux ne l'a donc lu. Pire, un Godot qui plante
      # pendant l'import laisse un log non vide sans « SCRIPT ERROR » : la validation 1 passe.
      #
      # On ne controle QUE les fichiers que le patch vient de modifier. Un balayage de tout
      # tools/ echouerait a tort : probe_fx_geste.gd reference l'autoload MerlinAudio, absent en
      # mode --check-only --script, alors qu'il tourne parfaitement comme scene (c'est la
      # validation 2). Seuls les scripts strictement duck-types passent ce mode -- ce qui est
      # justement la regle du dossier tools/.
      # Validation 3 — DIFFERENTIELLE, et c'est ce qui a change.
      #
      # Elle comparait chaque fichier touche a l'absolu : toute ligne « SCRIPT ERROR » le refusait.
      # Or `--check-only --script` NE RESOUT PAS LES AUTOLOADS. Un script du jeu qui en utilise un
      # (scripts/game/merlin_game.gd et MerlinAudio) produit donc « Identifier not found » AVANT
      # tout patch : la validation aurait rejete un correctif parfaitement sain, et le commentaire
      # d'origine le pressentait deja en restreignant l'usage aux scripts duck-types de tools/.
      #
      # On compare desormais le fichier PATCHE a sa version PRISTINE, mesuree sur la meme machine
      # dans le meme mode. Seule une erreur QUE LE PATCH A INTRODUITE fait echouer. Le bruit
      # structurel est donc neutralise sans etre masque — s'il grandit, la difference le dit.
      - name: Validation 3 — parse differentiel des scripts touches
        run: |
          TOUCHES="$(git diff --name-only -- '*.gd')"
          [ -n "$TOUCHES" ] || { echo "aucun script .gd touche"; exit 0; }
          erreurs() {
            timeout 300 ~/godot-bin/godot --headless --path . --check-only --script "res://$1" 2>&1 \
              | grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" | grep -av "\.tres" | sort -u
          }
          echec=0
          for f in $TOUCHES; do
            cp "$f" /tmp/patche.gd
            git checkout -- "$f"
            erreurs "$f" > /tmp/avant.txt
            cp /tmp/patche.gd "$f"
            erreurs "$f" > /tmp/apres.txt
            NEUVES="$(comm -13 /tmp/avant.txt /tmp/apres.txt)"
            if [ -n "$NEUVES" ]; then
              echo "::error::$f — le patch INTRODUIT des erreurs :"
              echo "$NEUVES" | head -5
              echec=1
            else
              PRE=$(wc -l < /tmp/avant.txt)
              echo "ok $f (bruit structurel prealable : $PRE ligne(s), inchange)"
            fi
          done
          [ "$echec" -eq 0 ] || { echo "::error::un patch introduit une erreur — rien n'est pousse"; exit 1; }
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_scenario.gd tools/probe_partie_journal.gd scripts/llm/merlin_prompt_builder.gd scripts/llm/merlin_native.gd scripts/game/merlin_game.gd
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "fix(jeu): v53 - une seule avance par beat" -m "MESURE : le journal de p74 porte 20 beats d index 1-14, 16-20, 22. Les index 15 et 21 MANQUENT, alors que le bloc fin declare beats_joues=22. Deux beats ont ete joues sans jamais etre ouverts a la sonde." -m "POURQUOI CELA COMPTE PLUS QU UN COMPTAGE : le verdict juge la partie sur ces entrees. Il a donc annonce reussite 20/20, continuite 15/19 et attente moyenne 33 s sur un echantillon incomplet, sans le dire. Un chiffre dont on ignore le denominateur ne vaut rien." -m "LA FENETRE COUPABLE, verifiee ligne a ligne : _present_current_beat pose _beat_transition a true (302) et efface _can_advance (354) ; le callback de swap_zone ne relache _beat_transition qu en 401, une ligne avant _state = 1 (403). Entre les deux, _state vaut ENCORE 2. Sur un beat Rencontre, le typewriter d arrivee du colporteur survit a la fermeture de sa vitrine ; s il finit dans cette fenetre, _on_typewriter_done rearmait _can_advance sur un beat DEJA avance. La sonde, qui attend exactement _state == 2 and _can_advance, tirait une seconde fois." -m "LE RISQUE, ET POURQUOI IL NE TIENT PAS : si _beat_transition restait bloque a true, le caret ne reviendrait jamais, soit un softlock, pire que le beat saute. Verifie plutot que suppose : MerlinVisual.swap_zone porte une garantie EXACTEMENT-UNE-FOIS explicite, ajoutee par R159 contre ce risque precis, ou le kill-handler joue lui-meme le build en attente avant de le remplacer." -m "CE QUE CE PATCH NE COUVRE PAS : ce mecanisme explique le trou du beat 15, precede d un etal de colporteur. Le second trou, apres l entree 20, n a ni etal ni incident dans le journal, et je n ai pas etabli ce qui a re-arme _can_advance la. Le verdict declare desormais les trous d index plutot que de les taire." -m "Parse editeur complet verifie ; le bruit d autoload du mode --check-only est identique avant et apres patch." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
