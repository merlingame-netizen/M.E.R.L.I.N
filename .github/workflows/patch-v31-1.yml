# Patcheur du jeu — remplacements exacts + VALIDATION GODOT + commit + push sur feat/practices-docs.
#
# La validation vit dans le patcheur : parse check editeur puis sonde du geste, sur Godot 4.4.1
# (parite VM/box — 4.5-stable a pendu 2 h 27 sur ce depot), et REFUS de pousser si l'un des deux
# echoue. Un patch casse ne peut plus atteindre la branche du jeu.
name: patch-v31-1
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/patches/**"]
permissions:
  contents: write
# Deux pushes rapproches = deux runs sur la meme cible : l'ancien n'a plus de valeur, il est
# annule (c'est aussi ce qui aurait coupe le run 4.5 pendu, que le token ne pouvait annuler).
concurrency:
  group: patch-v31-1
  cancel-in-progress: true
jobs:
  patch:
    runs-on: ubuntu-latest
    # Sans borne, un editeur qui pend mange six heures de minutes Actions (vecu).
    timeout-minutes: 50
    steps:
      - name: Jeu (feat/practices-docs)
        uses: actions/checkout@v4
        with:
          ref: feat/practices-docs
      - name: Outillage (script de patch)
        uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
          path: outillage
      - name: Appliquer le patch
        run: python3 outillage/infra/patches/v49_le_fil_concret.py
      - name: Godot en cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-4.4.1-stable-linux-x86_64
      - name: Godot (telechargement si cache froid)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          curl -fsSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.4.1-stable_linux.x86_64 godot
          chmod +x godot
      - name: Validation 1 — parse check editeur
        run: |
          ~/godot-bin/godot --version
          timeout 600 ~/godot-bin/godot --headless --editor --quit --path . 2>&1 | tee /tmp/parse.log || true
          # Bruit tolere (absent du runner, sans rapport avec le patch) : gdextension ARM,
          # traductions non importees, police VT323. Toute erreur de SCRIPT est un refus.
          if grep -aE "SCRIPT ERROR|Compile Error" /tmp/parse.log; then
            echo "::error::le patch introduit des erreurs de script — rien n'est pousse"
            exit 1
          fi
          # Un log de parse VIDE (timeout sans une ligne utile) n'est pas un succes.
          if [ ! -s /tmp/parse.log ]; then
            echo "::error::parse check muet — rien n'est pousse"
            exit 1
          fi
      - name: Validation 2 — sonde du geste (l'animation tourne vraiment)
        run: |
          timeout 900 ~/godot-bin/godot --headless --path . res://tools/probe_fx_geste.tscn 2>&1 | tee /tmp/sonde.log || true
          grep -a "SONDE GESTE\|fantome\|ratio max" /tmp/sonde.log || true
          grep -aq "SONDE GESTE : OK" /tmp/sonde.log || {
            echo "::error::la sonde du geste n'a pas rendu OK — rien n'est pousse"
            exit 1
          }
      # Validation 3 — LES SCRIPTS DE tools/ TOUCHES PAR LE PATCH SONT VRAIMENT PARSES.
      #
      # Trou constate au run #37 (v48.1a) : la validation 1 (--editor --quit) a rendu en 10 s et
      # la validation 2 charge une scene qui n'inclut aucun script de tools/. Le patch touchait
      # probe_partie_journal.gd -- aucune des deux ne l'a donc lu. Pire, un Godot qui plante
      # pendant l'import laisse un log non vide sans « SCRIPT ERROR » : la validation 1 passe.
      #
      # On ne controle QUE les fichiers que le patch vient de modifier. Un balayage de tout
      # tools/ echouerait a tort : probe_fx_geste.gd reference l'autoload MerlinAudio, absent en
      # mode --check-only --script, alors qu'il tourne parfaitement comme scene (c'est la
      # validation 2). Seuls les scripts strictement duck-types passent ce mode -- ce qui est
      # justement la regle du dossier tools/.
      - name: Validation 3 — parse de TOUS les scripts touches par le patch
        run: |
          TOUCHES="$(git diff --name-only -- '*.gd')"
          [ -n "$TOUCHES" ] || { echo "aucun script .gd touche — rien a controler"; exit 0; }
          echec=0
          for f in $TOUCHES; do
            timeout 300 ~/godot-bin/godot --headless --path . --check-only \
              --script "res://$f" > /tmp/chk.log 2>&1 || true
            if grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" /tmp/chk.log | grep -av "\.tres" | grep -aq .; then
              echo "::error::$f ne parse pas"
              grep -aE "SCRIPT ERROR|Parse Error:|Compile Error" /tmp/chk.log | grep -av "\.tres" | head -5
              echec=1
            else
              echo "ok $f"
            fi
          done
          [ "$echec" -eq 0 ] || { echo "::error::un script touche ne parse pas — rien n'est pousse"; exit 1; }
      - name: Commit et push
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add scripts/llm/merlin_prompt_builder.gd scripts/llm/merlin_scenario.gd
          git diff --cached --quiet && { echo "rien a committer"; exit 0; }
          git commit -m "feat(jeu): v49 - le fil concret, la scene s ouvre sur ce qui vient de se passer" -m "Maxime : une fois un beat redige et resolu il ne rentre pas dans le contexte redactionnel du beat qui suit, on dirait des choix independants, je veux de la continuite." -m "DIAGNOSTIC. Les six scenes de la derniere partie portent provenance=arc : elles ont ete ecrites AVANT d etre jouees, a partir du seul titre et du pitch. La seule chose du beat N qui atteignait le beat N+1 etait un pont MECANIQUE — un registre de verbes plus une locomotion tiree au sort, sans un nom propre, sans un element du monde." -m "CE QUI REND LE CORRECTIF GRATUIT. La matiere de la continuite existait deja et le code la jetait. La tete du prompt d issue exige une derniere phrase qui ouvre la suite ; le modele obeit ; et note_issue_affichee tronquait l issue a ses 420 PREMIERS caracteres, ce qui perdait exactement cette phrase sur quatre issues sur six. Puis personne ne la lisait : last_issue n etait consomme que par le lookahead, debranche depuis v38. Il suffisait de garder la bonne moitie du texte et de la lire. Zero token de generation supplementaire." -m "SEPT CHANGEMENTS. P1 la derniere phrase doit NOMMER l etre ou l objet qui reagit (tete stable, cout nul par beat). P2 elle est gardee (troncature par la FIN) et devient le pont ; un extracteur la valide et REFUSE plutot que de servir une phrase fausse une fois transplantee — refuser rend simplement le pont mecanique, donc jamais pire qu avant. P3 le pont peut etre une phrase pleine, et le Climax y a droit : il ne portait AUCUNE trace du beat precedent, le pont l excluant et le lookahead retournant dessus. P4 le filet anti-echo compare a la scene SEULE, sans les coutures du code, sinon il supprimait en priorite les phrases qui reprennent ce qui precede — la continuite meme. P5 le fil entre aussi dans le prompt d issue par la QUEUE, ou SITU_MAX ne peut pas le tronquer : il passe de 25 a 100 pour cent de presence. P6 les exemples du prompt systeme sortent : un vieil homme sort de sa hutte se recopiait verbatim dans la prose et simulait une fausse memoire, rendant tout test de continuite ininterpretable. P7 le pont mecanique, qui reste le repli, cesse d afficher de l ASCII et de se repeter mot pour mot." -m "CE QUE LE PATCH NE FAIT PAS : ranimer le lookahead. L enquete a mesure que la fenetre n existe toujours pas (95 a 108 s pour une fenetre de 53 a 70 s) et surtout que, meme ranime, il ne recevrait PAS l issue : issue_prec prend last_gist en priorite et note_outcome, appele avant, le remplit toujours. Il recevrait le meme registre abstrait que le pont." -m "VERIFIE : l extracteur rend un fil sur les SIX issues reelles de la derniere partie. Le beat 2 se serait ouvert sur Le petit cerf arrete de boire et fixe la terre devant lui avant de s eloigner lentement, au lieu de Vous avez vu ce qui se cachait et avez trouve les mots." -m "Issu d une enquete adversariale a 13 agents. Parse check Godot 4.4.1 passe en local sur les deux fichiers." -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
          git push origin HEAD:feat/practices-docs
