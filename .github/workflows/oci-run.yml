# LE PONT OCI — lancer des Run Commands sur merlin-arm-a1 (et demarrer/arreter l'instance)
# sans qu'aucun secret ne transite par la conversation.
#
# Le pont SSH (vm-run) est reste inerte : ocarun est en nologin, opc n'a aucune cle installee,
# et Run Command ne donne pas sudo. Celui-ci passe PAR L'API D'ORACLE elle-meme — le meme
# mecanisme que le bouton « Run Command » de la console, mais declenche par un push :
#
#   moi -> push infra/oci-run/cmd-NNN.sh  -> ce workflow -> API Oracle -> la VM execute (ocarun)
#   moi <- resultat commite dans resultats/ <- sortie de la commande (tronquee ~2 Ko par Oracle ;
#          les gros retours passent par ntfy depuis le script lui-meme, comme le Courrier)
#
# Et un fichier infra/oci-run/action-NNN.txt contenant START, STOP ou RESET pilote l'instance
# elle-meme — le trou que SSH ne pouvait pas combler (rallumer une VM eteinte).
#
# Secrets requis (Settings > Secrets > Actions) : OCI_USER_OCID, OCI_TENANCY_OCID,
# OCI_FINGERPRINT, OCI_REGION, OCI_PRIVATE_KEY, OCI_INSTANCE_OCID. Revocation en un geste :
# supprimer la cle API dans la console Oracle (profil > API keys).
name: oci-run
on:
  push:
    branches: [claude/oracle-free-tier-access-IN1Wm]
    paths: ["infra/oci-run/cmd-*.sh", "infra/oci-run/action-*.txt"]
permissions:
  contents: write
concurrency:
  group: oci-run
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/oracle-free-tier-access-IN1Wm
      - name: Configurer le client OCI
        env:
          K: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          set -u
          if [ -z "${K:-}" ]; then echo "OCI_PRIVATE_KEY absent — pont inactif (infra/oci-run/README.md)"; exit 0; fi
          pip install -q oci-cli 2>&1 | tail -1 || pip install oci-cli
          mkdir -p ~/.oci
          printf '%s\n' "$K" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          region=${{ secrets.OCI_REGION }}
          key_file=$HOME/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config
          oci iam region list --output table >/dev/null 2>&1 && echo "client OCI : OK" || { echo "client OCI : ECHEC d'authentification — verifier les 5 secrets"; exit 1; }
      - name: Executer
        env:
          INSTANCE: ${{ secrets.OCI_INSTANCE_OCID }}
        run: |
          set -u
          [ -f ~/.oci/config ] || exit 0
          [ -n "${INSTANCE:-}" ] || { echo "OCI_INSTANCE_OCID absent"; exit 1; }
          mkdir -p infra/oci-run/resultats
          DERNIER_CMD="$(ls infra/oci-run/cmd-*.sh 2>/dev/null | sort | tail -1)"
          DERNIERE_ACTION="$(ls infra/oci-run/action-*.txt 2>/dev/null | sort | tail -1)"
          # ── pilotage de l'instance (START/STOP/RESET) ──
          if [ -n "$DERNIERE_ACTION" ] && [ ! -f "infra/oci-run/resultats/$(basename "$DERNIERE_ACTION" .txt).txt" ]; then
            A="$(tr -d '[:space:]' < "$DERNIERE_ACTION" | tr a-z A-Z)"
            N="$(basename "$DERNIERE_ACTION" .txt)"
            case "$A" in START|STOP|SOFTRESET|RESET) ;; *) echo "action inconnue: $A"; exit 1;; esac
            oci compute instance action --instance-id "$INSTANCE" --action "$A" \
              --query 'data."lifecycle-state"' --raw-output > "infra/oci-run/resultats/$N.txt" 2>&1 || true
            echo "action=$A demandee · etat=$(cat "infra/oci-run/resultats/$N.txt")" | tee "infra/oci-run/resultats/$N.txt"
          fi
          # ── Run Command ──
          if [ -n "$DERNIER_CMD" ] && [ ! -f "infra/oci-run/resultats/$(basename "$DERNIER_CMD" .sh).txt" ]; then
            N="$(basename "$DERNIER_CMD" .sh)"
            # Le script du depot EST la charge : la commande envoyee a Oracle tient en une ligne
            # (limite de taille du canal TEXT) et va le chercher sur le depot public.
            RAW="https://raw.githubusercontent.com/merlingame-netizen/M.E.R.L.I.N/claude/oracle-free-tier-access-IN1Wm/$DERNIER_CMD"
            BOOT="bash <(curl -fsSL '$RAW') 2>&1 | tail -c 1900"
            COMP="$(oci compute instance get --instance-id "$INSTANCE" --query 'data."compartment-id"' --raw-output)"
            CID="$(oci instance-agent command create --compartment-id "$COMP" \
              --target "{\"instanceId\":\"$INSTANCE\"}" \
              --content "{\"source\":{\"sourceType\":\"TEXT\",\"text\":$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1]))' "$BOOT")},\"output\":{\"outputType\":\"TEXT\"}}" \
              --display-name "$N" --timeout-in-seconds 3500 \
              --query 'data.id' --raw-output)"
            echo "commande creee : $CID"
            ETAT=""; SORTIE=""
            for i in $(seq 1 120); do
              sleep 30
              J="$(oci instance-agent command-execution get --command-id "$CID" --instance-id "$INSTANCE" --output json 2>/dev/null || true)"
              ETAT="$(echo "$J" | python3 -c 'import json,sys;print((json.load(sys.stdin).get("data") or {}).get("lifecycle-state","?"))' 2>/dev/null || echo '?')"
              echo "t+$((i*30))s etat=$ETAT"
              case "$ETAT" in SUCCEEDED|FAILED|TIMED_OUT|CANCELED) SORTIE="$(echo "$J" | python3 -c 'import json,sys;d=(json.load(sys.stdin).get("data") or {});print(((d.get("content") or {}).get("text") or "").strip())' 2>/dev/null)"; break;; esac
            done
            {
              echo "$SORTIE"
              echo ""
              echo "== fin : etat=$ETAT $(date -u +%FT%TZ) · sortie Oracle tronquee ~2 Ko — gros retours via ntfy =="
            } > "infra/oci-run/resultats/$N.txt"
            tail -30 "infra/oci-run/resultats/$N.txt"
          fi
          if [ -n "$(git status --porcelain infra/oci-run/resultats)" ]; then
            git config user.name "Claude"
            git config user.email "noreply@anthropic.com"
            git add infra/oci-run/resultats
            git commit -m "chore(oci-run): resultat(s)" -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" -m "Claude-Session: https://claude.ai/code/session_0157gQr3LaN14SCz5LWYrKPq"
            git pull --rebase --quiet origin claude/oracle-free-tier-access-IN1Wm || true
            git push origin HEAD:claude/oracle-free-tier-access-IN1Wm
          fi
